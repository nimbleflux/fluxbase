services:
  app:
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile
    container_name: fluxbase-dev
    volumes:
      - ..:/workspace:cached
      - go-modules:/go/pkg
      - vscode-extensions:/home/vscode/.vscode-server/extensions
      # Docker-in-Docker: Mount Docker socket from host
      - /var/run/docker.sock:/var/run/docker.sock
      - storage:/storage
    privileged: true
    command: sleep infinity
    environment:
      # Go environment
      GO111MODULE: "on"
      GOPATH: "/go"
      CGO_ENABLED: "1"

      # Application environment
      FLUXBASE_DATABASE_HOST: postgres
      FLUXBASE_DATABASE_PORT: 5432
      FLUXBASE_DATABASE_USER: fluxbase_app
      FLUXBASE_DATABASE_PASSWORD: fluxbase_app_password
      FLUXBASE_DATABASE_DATABASE: fluxbase_dev
      # This is just for the devcontainer. In production, you should use a strong, unique secret and manage it securely.
      # Value below is an obviously-fake placeholder that still passes the server's
      # boot guard (>=32 chars, entropy >= 4.5 bits/char, not the blacklisted default).
      FLUXBASE_AUTH_JWT_SECRET: devcontainer-JWT-placeholder-N0tF0rPr0duct10n-ch4ng3-me!2026
      FLUXBASE_DEBUG: "true"
      FLUXBASE_STORAGE_PROVIDER: s3
      FLUXBASE_STORAGE_S3_ENDPOINT: http://minio:9000
      FLUXBASE_STORAGE_S3_ACCESS_KEY: minioadmin
      FLUXBASE_STORAGE_S3_SECRET_KEY: minioadmin
      FLUXBASE_STORAGE_S3_REGION: us-east-1
      FLUXBASE_REALTIME_ENABLED: "true"

      # Logging backend configuration (for testing different backends)
      # Uncomment to test different backends:
      # FLUXBASE_LOGGING_BACKEND: "elasticsearch"
      # FLUXBASE_LOGGING_BACKEND: "clickhouse"
      # FLUXBASE_LOGGING_BACKEND: "loki"
      # FLUXBASE_LOGGING_ELASTICSEARCH_URLS: "http://elasticsearch:9200"
      # FLUXBASE_LOGGING_CLICKHOUSE_ADDRESSES: "clickhouse:9000"
      # FLUXBASE_LOGGING_CLICKHOUSE_DATABASE: "fluxbase"
      # FLUXBASE_LOGGING_LOKI_URL: "http://loki:3100"

      # Development tools
      COLORTERM: truecolor
      TERM: xterm-256color
    networks:
      - fluxbase-dev-network
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: ghcr.io/nimbleflux/fluxbase-postgres:18
    container_name: fluxbase-postgres-dev
    restart: unless-stopped
    command: postgres -c max_connections=400
    volumes:
      - postgres-data:/var/lib/postgresql
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: fluxbase_dev
    networks:
      - fluxbase-dev-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  mailhog:
    image: mailhog/mailhog:latest@sha256:8d76a3d4ffa32a3661311944007a415332c4bb855657f4f6c57996405c009bea
    container_name: fluxbase-mailhog-dev
    restart: unless-stopped
    networks:
      - fluxbase-dev-network

  minio:
    image: minio/minio:latest@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    container_name: fluxbase-minio-dev
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio-data:/data
    networks:
      - fluxbase-dev-network
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Elasticsearch Service (for logging backend testing)
  elasticsearch:
    image: elasticsearch:9.5.3@sha256:e23d4758358a4e356cc2ef3259a5a6f345cacc1722c10dffe6d7150a1a78e52f
    container_name: fluxbase-elasticsearch-dev
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    networks:
      - fluxbase-dev-network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  # ClickHouse Service (for logging backend testing)
  clickhouse:
    image: clickhouse:26.6
    container_name: fluxbase-clickhouse-dev
    restart: unless-stopped
    ports:
      - "8123:8123"
      - "9000:9000"
    environment:
      CLICKHOUSE_DB: fluxbase
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: ""
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    volumes:
      - clickhouse-data:/var/lib/clickhouse
    networks:
      - fluxbase-dev-network
    healthcheck:
      test: ["CMD", "clickhouse-client", "--query", "SELECT 1"]
      interval: 30s
      timeout: 10s
      retries: 5

  # Grafana Loki Service (for logging backend testing)
  loki:
    image: grafana/loki:3.7.8@sha256:1107dd5274e0ada47e42472b7a7e71f3b2a2fe878878108f3e2f9e51528f0193
    container_name: fluxbase-loki-dev
    restart: unless-stopped
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - fluxbase-dev-network
    volumes:
      - ./loki-config:/etc/loki-config:ro
      - loki-data:/loki
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "--tries=1", "http://localhost:3100/ready"]
      interval: 30s
      timeout: 10s
      retries: 5

  # Dex - OIDC provider for OAuth E2E testing
  dex:
    image: ghcr.io/dexidp/dex:latest@sha256:3cea00341c073adcf45b6f8ae9d3c26e5e1201316e3a5793c9129d8373f7bee6
    container_name: fluxbase-dex-dev
    restart: unless-stopped
    command: dex serve /etc/dex/config.yaml
    volumes:
      - ./dex-config.yaml:/etc/dex/config.yaml:ro
    ports:
      - "5556:5556"
    networks:
      - fluxbase-dev-network
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:5556/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  go-modules:
  vscode-extensions:
  postgres-data:
  minio-data:
  storage:
  elasticsearch-data:
  clickhouse-data:
  loki-data:

networks:
  fluxbase-dev-network:
    name: fluxbase-dev-network
    driver: bridge
