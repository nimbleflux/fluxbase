# Dokka: DGP V2 (default since 2.2.0) dropped the GFM output format that the
# committed Starlight docs pipeline depends on, so stay on V1 (classic) mode.
# V1 mode is deprecated upstream and will require a docs-pipeline rework when removed.
org.jetbrains.dokka.experimental.gradle.pluginMode=V1Enabled
org.jetbrains.dokka.experimental.gradle.pluginMode.nowarn=true
