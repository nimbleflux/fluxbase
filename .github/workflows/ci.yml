name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      postgres_tag:
        description: "Custom Postgres image tag (e.g., add-new-feature)"
        required: false
        default: "18"
        type: string

# Cancel superseded runs: a new push to the same PR stops the outdated run
# immediately. Merges to main are never cancelled - each merge is validated
# to completion.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Least privilege: CI only reads source and uploads artifacts/coverage.
# The Codecov steps authenticate with the CODECOV_TOKEN secret, not the
# GITHUB_TOKEN, so no job needs anything beyond read.
permissions:
  contents: read

env:
  # Single source of truth for the linter version in CI. The Makefile
  # (`make lint`) and lefthook pin the same version for their installer
  # one-liners — Renovate updates all three together (regexManagers).
  GOLANGCI_LINT_VERSION: v2.14.0

jobs:
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    timeout-minutes: 1
    outputs:
      go: ${{ steps.filter.outputs.go }}
      go-core: ${{ steps.filter.outputs.go-core }}
      go-areas: ${{ steps.go-areas.outputs.areas }}
      admin-ui: ${{ steps.filter.outputs.admin-ui }}
      sdk: ${{ steps.filter.outputs.sdk }}
      e2e-ui: ${{ steps.filter.outputs.e2e-ui }}
      docker: ${{ steps.filter.outputs.docker }}
      ci-config: ${{ steps.filter.outputs.ci-config }}
      code-any: ${{ steps.filter.outputs.code-any }}
      ocr-go: ${{ steps.filter.outputs.ocr-go }}
      version-files: ${{ steps.filter.outputs.version-files }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        id: filter
        with:
          filters: |
            go:
              - '**.go'
              - 'go.mod'
              - 'go.sum'
              - 'internal/**'
              - 'cmd/**'
              - 'cli/**'
              - 'seeds/**'
              - 'scripts/**'
              - 'Makefile'
              - 'lefthook.yml'
              - '.testcoverage.yml'
              - '.golangci.yml'
            go-core:
              # Packages imported broadly across the codebase — a change to
              # any of these fans out to the full unit + e2e suite. Verified
              # import fan-out: crypto(6), errors(6), util(5), keys/secrets/
              # pubsub/runtime(3-4), query(2, but feeds api). Adding these
              # fixes a consistency bug where they were treated as leaf
              # packages and went through the (already-broken) selective path.
              - 'internal/config/**'
              - 'internal/database/**'
              - 'internal/auth/**'
              - 'internal/middleware/**'
              - 'internal/crypto/**'
              - 'internal/keys/**'
              - 'internal/secrets/**'
              - 'internal/errors/**'
              - 'internal/util/**'
              - 'internal/pubsub/**'
              - 'internal/query/**'
              - 'internal/runtime/**'
              - 'go.mod'
              - 'go.sum'
            admin-ui:
              - 'admin/src/**'
              - 'admin/public/**'
              - 'admin/index.html'
              - 'admin/package.json'
              - 'admin/vite.config.ts'
              - 'admin/tsconfig*.json'
              - 'admin/components.json'
              - 'admin/eslint.config.js'
              - 'package.json'
              - 'bun.lock'
            sdk:
              - 'sdk/src/**'
              - 'sdk/package.json'
              - 'sdk/tsup.config.ts'
              - 'sdk/tsconfig.json'
              - 'sdk/vitest.config.ts'
              - 'sdk/scripts/**'
              - 'sdk-react/src/**'
              - 'sdk-react/package.json'
              - 'sdk-react/tsup.config.ts'
              - 'sdk-react/tsconfig.json'
              - 'sdk-svelte/src/**'
              - 'sdk-svelte/package.json'
              - 'sdk-svelte/tsup.config.ts'
              - 'sdk-svelte/tsconfig.json'
              - 'sdk-svelte/vitest.config.ts'
              - 'sdk-next/src/**'
              - 'sdk-next/package.json'
              - 'sdk-next/tsup.config.ts'
              - 'sdk-next/tsconfig.json'
              - 'sdk-vue/src/**'
              - 'sdk-vue/package.json'
              - 'sdk-vue/tsup.config.ts'
              - 'sdk-vue/tsconfig.json'
              - 'package.json'
              - 'bun.lock'
            e2e-ui:
              - 'admin/tests/**'
              - 'admin/playwright.config.ts'
              - 'admin/global-setup.ts'
              - 'admin/global-teardown.ts'
            ocr-go:
              # The cgo/vips build (test-go-build-tags) only exercises code
              # that can use the ocr build tag, plus the module and image
              # definitions that affect it.
              - 'internal/storage/**'
              - 'internal/ai/**'
              - 'internal/extensions/**'
              - 'go.mod'
              - 'go.sum'
            docker:
              - 'Dockerfile'
              - 'Dockerfile.docs'
              - 'docker-compose.yml'
              - '.dockerignore'
            ci-config:
              - '.github/workflows/**'
              - '.github/actions/**'
            version-files:
              # Every file scripts/set-version.sh writes (plus the script and
              # its inputs). Gates the version-drift job.
              - 'VERSION'
              - 'deploy/helm/fluxbase/Chart.yaml'
              - 'deploy/helm/fluxbase/values.yaml'
              - 'deploy/docker-compose.yml'
              - 'deploy/docker-compose.minimal.yaml'
              - 'deploy/.env.example'
              - 'sdk/package.json'
              - 'sdk-react/package.json'
              - 'sdk-svelte/package.json'
              - 'sdk-next/package.json'
              - 'sdk-vue/package.json'
              - 'admin/package.json'
              - 'bun.lock'
              - 'docs/src/content/docs/cli/installation.md'
              - 'postgres/versions.json'
              - 'scripts/set-version.sh'
            code-any:
              - '**.go'
              - 'go.mod'
              - 'go.sum'
              - 'internal/**'
              - 'cmd/**'
              - 'cli/**'
              - 'admin/src/**'
              - 'admin/public/**'
              - 'admin/index.html'
              - 'admin/package.json'
              - 'admin/vite.config.ts'
              - 'admin/tests/**'
              - 'admin/playwright.config.ts'
              - 'sdk/src/**'
              - 'sdk/package.json'
              - 'sdk/scripts/**'
              - 'sdk-react/src/**'
              - 'sdk-react/package.json'
              - 'package.json'
              - 'bun.lock'
              - 'Dockerfile'
              - 'Dockerfile.docs'
              - 'Makefile'
              - 'scripts/**'
              - 'seeds/**'

      - name: Detect changed Go areas
        id: go-areas
        if: steps.filter.outputs.go == 'true'
        run: |
          # If core packages changed, test everything
          if [ "${{ steps.filter.outputs.go-core }}" = "true" ]; then
            echo "areas=all" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # List changed internal modules
          AREAS=$(git diff --name-only origin/main...HEAD -- 'internal/**/*.go' 'cmd/**/*.go' 'cli/**/*.go' | \
            grep -oP 'internal/\K[^/]+|cmd|cli' | sort -u | tr '\n' ',' | sed 's/,$//')
          echo "areas=${AREAS:-all}" >> "$GITHUB_OUTPUT"

  lint-go:
    name: Lint Go
    needs: changes
    if: >
      github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch' ||
      needs.changes.outputs.go == 'true' ||
      needs.changes.outputs.ci-config == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Get dependencies
        run: |
          go mod download
          go mod verify

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.3

      - name: Set up Node.js for embedded SDK generation
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24.20.0"

      - name: Generate embedded SDK for Jobs runtime
        run: |
          cd sdk
          bun install --frozen-lockfile
          bun run generate:embedded-sdk

      - name: Create dist directory with placeholder for embed directive
        run: |
          mkdir -p internal/adminui/dist
          echo '<!DOCTYPE html><html><head><title>Placeholder</title></head><body></body></html>' > internal/adminui/dist/index.html

      - name: Run golangci-lint
        # Action adds module + build caches over the raw binary install.
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}
          args: --timeout 10m ./internal/... ./cmd/... ./cli/...

      - name: Run golangci-lint (integration-tagged test tree)
        # Lint ./test/... with the `integration` build tag so type errors in
        # the tag-gated e2e tree surface here instead of only in release-time
        # test runs.
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}
          args: --build-tags integration --timeout 10m ./test/...

      - name: Install gofumpt
        run: go install mvdan.cc/gofumpt@latest

      - name: Install lefthook
        run: go install github.com/evilmartians/lefthook@latest

      - name: Check Go formatting with gofumpt
        run: |
          if [ "$(gofumpt -l . | wc -l)" -gt 0 ]; then
            echo "Please run 'make fmt' or 'gofumpt -w .'"
            gofumpt -l .
            exit 1
          fi

      - name: Run pre-commit checks with lefthook
        run: lefthook run pre-commit

  lint-typescript:
    name: Lint TypeScript
    needs: changes
    if: >
      github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch' ||
      needs.changes.outputs.admin-ui == 'true' ||
      needs.changes.outputs.ci-config == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.3

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24.20.0"

      - name: Install dependencies (workspace)
        run: bun install --frozen-lockfile

      - name: Lint Admin
        working-directory: ./admin
        run: bun run lint

  test-sdk:
    name: Test SDK
    needs: changes
    # Add the 'skip-tests' label to a PR to skip the UI/SDK test suites
    # (lint and Go tests still run). Main pushes always run everything.
    if: >
      !contains(github.event.pull_request.labels.*.name, 'skip-tests') &&
      (github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch' ||
      needs.changes.outputs.sdk == 'true' ||
      needs.changes.outputs.admin-ui == 'true' ||
      needs.changes.outputs.ci-config == 'true')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.3

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24.20.0"

      - name: Install dependencies (workspace)
        run: bun install --frozen-lockfile

      - name: Run admin unit tests (vitest)
        working-directory: ./admin
        run: bun run test

      - name: Verify test file content (debug)
        working-directory: ./sdk
        run: |
          echo "Checking constructor mock syntax in client.test.ts:"
          grep -A2 "vi.mock.*fetch" src/client.test.ts | head -5

      - name: Run SDK tests with coverage
        working-directory: ./sdk
        run: bun run test:ci

      - name: Upload SDK coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./sdk/coverage/coverage-final.json
          flags: sdk
          name: sdk-coverage
          fail_ci_if_error: false
          verbose: true
          slug: nimbleflux/fluxbase

      - name: Type check SDK
        working-directory: ./sdk
        run: bun run type-check

      - name: Build SDK
        working-directory: ./sdk
        run: bun run build

      - name: Type check SDK-React
        working-directory: ./sdk-react
        run: bun run type-check

      - name: Build SDK-React
        working-directory: ./sdk-react
        run: bun run build

      - name: Test SDK-Svelte
        working-directory: ./sdk-svelte
        run: bun run test

      - name: Type check SDK-Svelte
        working-directory: ./sdk-svelte
        run: bun run type-check

      - name: Build SDK-Svelte
        working-directory: ./sdk-svelte
        run: bun run build

      - name: Test SDK-Next
        working-directory: ./sdk-next
        run: bun run test

      - name: Type check SDK-Next
        working-directory: ./sdk-next
        run: bun run type-check

      - name: Build SDK-Next
        working-directory: ./sdk-next
        run: bun run build

      - name: Test SDK-Vue
        working-directory: ./sdk-vue
        run: bun run test

      - name: Type check SDK-Vue
        working-directory: ./sdk-vue
        run: bun run type-check

      - name: Build SDK-Vue
        working-directory: ./sdk-vue
        run: bun run build

      - name: Type check Admin
        working-directory: ./admin
        run: bun run type-check

  test-go:
    name: Test Go
    needs: changes
    if: >
      github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch' ||
      needs.changes.outputs.go == 'true' ||
      needs.changes.outputs.ci-config == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: ghcr.io/nimbleflux/fluxbase-postgres:${{ inputs.postgres_tag || '18' }}
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: fluxbase_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
        # Configure PostgreSQL with custom settings
        # Note: In GitHub Actions, we need to use a workaround to pass postgres args
        # We'll do this via a step that restarts postgres after configuration

      mailhog:
        image: mailhog/mailhog:latest@sha256:8d76a3d4ffa32a3661311944007a415332c4bb855657f4f6c57996405c009bea
        ports:
          - 1025:1025 # SMTP
          - 8025:8025 # Web UI

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Get dependencies
        run: |
          go mod download
          go mod verify

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.3

      - name: Set up Node.js for embedded SDK generation
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24.20.0"

      - name: Generate embedded SDK for Jobs runtime
        run: |
          cd sdk
          bun install --frozen-lockfile
          bun run generate:embedded-sdk

      - name: Install Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.7

      - name: Create dist directory with placeholder for embed directive
        run: |
          mkdir -p internal/adminui/dist
          echo '<!DOCTYPE html><html><head><title>Placeholder</title></head><body></body></html>' > internal/adminui/dist/index.html

      - name: Increase PostgreSQL max_connections
        env:
          PGPASSWORD: postgres
        run: |
          # Default max_connections=100 is too low for test connection pools.
          # The e2e tests create multiple pools (main, superuser, RLS) that
          # together consume ~12+ connections, and the server's internal pools
          # add more. Increase to 400 to prevent connection exhaustion.
          psql -h localhost -U postgres -c "ALTER SYSTEM SET max_connections = 400;"
          PG_CONTAINER=$(docker ps --format '{{.ID}}' --filter "publish=5432")
          if [ -n "$PG_CONTAINER" ]; then
            docker restart "$PG_CONTAINER"
            sleep 5
            for i in $(seq 1 30); do
              if psql -h localhost -U postgres -c "SELECT 1" > /dev/null 2>&1; then
                echo "PostgreSQL ready with max_connections=400"
                break
              fi
              sleep 1
            done
          fi

      - name: Create E2E test database and users
        env:
          PGPASSWORD: postgres
        run: |
          # Create the Go E2E test database (tests self-bootstrap on every run)
          psql -h localhost -U postgres -c "CREATE DATABASE fluxbase_go_e2e;"

          # Create fluxbase_app user with BYPASSRLS for general testing
          # CREATEROLE is needed for bootstrap which creates database roles
          psql -h localhost -U postgres -d fluxbase_go_e2e -c "CREATE USER fluxbase_app WITH PASSWORD 'fluxbase_app_password' LOGIN BYPASSRLS CREATEDB CREATEROLE;"
          psql -h localhost -U postgres -d fluxbase_go_e2e -c "GRANT ALL PRIVILEGES ON DATABASE fluxbase_go_e2e TO fluxbase_app;"

          # Create fluxbase_rls_test user for RLS policy testing (without BYPASSRLS)
          psql -h localhost -U postgres -d fluxbase_go_e2e -c "CREATE USER fluxbase_rls_test WITH PASSWORD 'fluxbase_rls_test_password' LOGIN NOBYPASSRLS CREATEDB;"
          psql -h localhost -U postgres -d fluxbase_go_e2e -c "GRANT ALL PRIVILEGES ON DATABASE fluxbase_go_e2e TO fluxbase_rls_test;"

          # Enable pgvector extension for AI/RAG features
          psql -h localhost -U postgres -d fluxbase_go_e2e -c "CREATE EXTENSION IF NOT EXISTS vector;"

      - name: Start S3 test server (SeaweedFS)
        run: |
          # MinIO no longer publishes pullable images (quay.io/Docker Hub both
          # reject anonymous access), so tests run against SeaweedFS in S3
          # mode. The identity config matches the minioadmin credentials the
          # tests were written with.
          mkdir -p /tmp/seaweed-ci
          cat > /tmp/seaweed-ci/s3.json <<'EOF'
          {"identities":[{"name":"minioadmin","credentials":[{"accessKey":"minioadmin","secretKey":"minioadmin"}],"actions":["Admin","Read","Write","List","Tagging"]}]}
          EOF
          docker run -d --name minio \
            -p 9000:9000 \
            -v /tmp/seaweed-ci/s3.json:/etc/seaweedfs/s3.json:ro \
            chrislusf/seaweedfs:dev \
            server -dir=/data -s3 -s3.port=9000 -s3.config=/etc/seaweedfs/s3.json -master.volumeSizeLimitMB=1024
          timeout 60 bash -c 'until curl -s http://localhost:9000/ > /dev/null 2>&1; do sleep 1; done'

      - name: Setup MinIO bucket
        run: |
          # Pre-create the default test bucket via the SeaweedFS shell
          # (individual tests create their own buckets as well). The master
          # needs a few seconds for raft leader election after start, so retry.
          for i in $(seq 1 10); do
            if docker exec minio sh -c 'echo "s3.bucket.create -name fluxbase-test" | weed shell -master=localhost:9333' 2>&1 | tee /tmp/bucket.out | grep -qE "created bucket|already exists"; then
              break
            fi
            echo "Bucket setup attempt $i failed — retrying in 3s"
            sleep 3
          done

      - name: Start Dex OIDC provider
        run: |
          docker run -d --name dex \
            -p 5556:5556 \
            -v "$(pwd)/test/e2e/dex-config-ci.yaml:/etc/dex/config.yaml:ro" \
            ghcr.io/dexidp/dex:latest \
            dex serve /etc/dex/config.yaml
          # Wait for Dex to be healthy
          for i in $(seq 1 30); do
            if curl -sf http://localhost:5556/dex/healthz > /dev/null 2>&1; then
              echo "Dex is ready"
              break
            fi
            if [ "$i" -eq 30 ]; then
              echo "Dex failed to start"
              docker logs dex
              exit 1
            fi
            sleep 1
          done

      - name: Run unit tests with coverage
        timeout-minutes: 20
        env:
          FLUXBASE_DATABASE_HOST: localhost
          FLUXBASE_DATABASE_PORT: 5432
          FLUXBASE_DATABASE_USER: fluxbase_app
          FLUXBASE_DATABASE_PASSWORD: fluxbase_app_password
          FLUXBASE_DATABASE_ADMIN_USER: postgres
          FLUXBASE_DATABASE_ADMIN_PASSWORD: postgres
          FLUXBASE_DATABASE_DATABASE: fluxbase_go_e2e
          SKIP_MIGRATIONS: "true"
        run: |
          if [ "${{ needs.changes.outputs.go-core }}" = "true" ] || \
             [ "${{ needs.changes.outputs.go-areas }}" = "all" ] || \
             [ -z "${{ needs.changes.outputs.go-areas }}" ]; then
            echo "Core package changed — running full test suite"
            go test -v -short -race -timeout=10m -coverprofile=coverage-unit.out -covermode=atomic $(go list ./... | grep -v '/test/e2e' | grep -v '/test$')
          else
            echo "Selective test — areas: ${{ needs.changes.outputs.go-areas }}"
            # Build package list from changed areas
            PKGS=""
            IFS=',' read -ra AREAS <<< "${{ needs.changes.outputs.go-areas }}"
            for area in "${AREAS[@]}"; do
              case "$area" in
                cmd)     PKGS="$PKGS ./cmd/..." ;;
                cli)     PKGS="$PKGS ./cli/..." ;;
                *)       PKGS="$PKGS ./internal/$area/..." ;;
              esac
            done

            # Always include API tests (integration verifier)
            PKGS="$PKGS ./internal/api/..."

            echo "Testing packages: $PKGS"
            go test -v -short -race -timeout=10m -coverprofile=coverage-unit.out -covermode=atomic $PKGS
          fi

      - name: Merge coverage reports
        run: |
          # Install gocovmerge to combine coverage profiles
          # Unit-only profile: package thresholds are enforced against this
          # profile (the integration job reports its own coverage separately).
          cp coverage-unit.out coverage.out
          # Generate HTML report from combined coverage
          go tool cover -html=coverage.out -o coverage.html

      - name: Check coverage thresholds
        run: |
          go install github.com/vladopajic/go-test-coverage/v2@v2.19.0 # pinned: v2.20.0 requires Go 1.27, CI runs 1.26.x

          # On a selective (non-core, partial-e2e) run, coverage-e2e.out only
          # reflects the selected tests, so the merged coverage.out would
          # under-count e2e-backed packages and could trip per-package
          # thresholds that a full run meets. Gate against unit-only coverage
          # in that case; the full gate still runs on core/all changes.
          cp coverage-unit.out coverage-gate.out

          # Temporarily point the config at the gate profile.
          sed "s|^profile: coverage.out|profile: coverage-gate.out|" .testcoverage.yml > .testcoverage-gate.yml

          # go-test-coverage v2 exits non-zero whenever ANY file has uncovered
          # lines — even when every configured threshold passes — so the exit
          # code alone is not a reliable gate. Instead we capture output and
          # fail only on an explicit threshold violation marker.
          #
          # Hardening: we also fail if the tool produces no recognizable
          # satisfied/violation verdict at all (e.g. it crashed or its output
          # format changed), so the gate cannot be silently disabled by an
          # unrelated tooling change.
          set +e
          output=$(go-test-coverage --config=.testcoverage-gate.yml 2>&1)
          exit_code=$?
          echo "$output"
          rm -f .testcoverage-gate.yml coverage-gate.out

          # 1. Explicit threshold violation → fail.
          if echo "$output" | grep -qiE "(satisfied|coverage threshold):\s*FAIL|not satisfied|below threshold"; then
            echo "::error::Coverage threshold check failed"
            exit 1
          fi

          # 2. No verdict line at all → tool misbehaved or output format
          #    changed; surface it rather than silently passing.
          if ! echo "$output" | grep -qiE "satisfied:\s*(PASS|FAIL)"; then
            echo "::error::go-test-coverage produced no PASS/FAIL verdict (exit $exit_code); treating as a gate failure"
            exit 1
          fi

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.out
          flags: unittests
          name: go-codecov
          fail_ci_if_error: true
          verbose: true
          slug: nimbleflux/fluxbase

      - name: Upload coverage artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: coverage-report
          path: |
            coverage.out
            coverage.html


  test-go-integration:
    name: Test Go (integration e2e)
    needs: changes
    if: >
      github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch' ||
      needs.changes.outputs.go == 'true' ||
      needs.changes.outputs.ci-config == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: ghcr.io/nimbleflux/fluxbase-postgres:${{ inputs.postgres_tag || '18' }}
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: fluxbase_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
        # Configure PostgreSQL with custom settings
        # Note: In GitHub Actions, we need to use a workaround to pass postgres args
        # We'll do this via a step that restarts postgres after configuration

      mailhog:
        image: mailhog/mailhog:latest@sha256:8d76a3d4ffa32a3661311944007a415332c4bb855657f4f6c57996405c009bea
        ports:
          - 1025:1025 # SMTP
          - 8025:8025 # Web UI

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Get dependencies
        run: |
          go mod download
          go mod verify

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.3

      - name: Set up Node.js for embedded SDK generation
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24.20.0"

      - name: Generate embedded SDK for Jobs runtime
        run: |
          cd sdk
          bun install --frozen-lockfile
          bun run generate:embedded-sdk

      - name: Install Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.7

      - name: Create dist directory with placeholder for embed directive
        run: |
          mkdir -p internal/adminui/dist
          echo '<!DOCTYPE html><html><head><title>Placeholder</title></head><body></body></html>' > internal/adminui/dist/index.html

      - name: Increase PostgreSQL max_connections
        env:
          PGPASSWORD: postgres
        run: |
          # Default max_connections=100 is too low for test connection pools.
          # The e2e tests create multiple pools (main, superuser, RLS) that
          # together consume ~12+ connections, and the server's internal pools
          # add more. Increase to 400 to prevent connection exhaustion.
          psql -h localhost -U postgres -c "ALTER SYSTEM SET max_connections = 400;"
          PG_CONTAINER=$(docker ps --format '{{.ID}}' --filter "publish=5432")
          if [ -n "$PG_CONTAINER" ]; then
            docker restart "$PG_CONTAINER"
            sleep 5
            for i in $(seq 1 30); do
              if psql -h localhost -U postgres -c "SELECT 1" > /dev/null 2>&1; then
                echo "PostgreSQL ready with max_connections=400"
                break
              fi
              sleep 1
            done
          fi

      - name: Create E2E test database and users
        env:
          PGPASSWORD: postgres
        run: |
          # Create the Go E2E test database (tests self-bootstrap on every run)
          psql -h localhost -U postgres -c "CREATE DATABASE fluxbase_go_e2e;"

          # Create fluxbase_app user with BYPASSRLS for general testing
          # CREATEROLE is needed for bootstrap which creates database roles
          psql -h localhost -U postgres -d fluxbase_go_e2e -c "CREATE USER fluxbase_app WITH PASSWORD 'fluxbase_app_password' LOGIN BYPASSRLS CREATEDB CREATEROLE;"
          psql -h localhost -U postgres -d fluxbase_go_e2e -c "GRANT ALL PRIVILEGES ON DATABASE fluxbase_go_e2e TO fluxbase_app;"

          # Create fluxbase_rls_test user for RLS policy testing (without BYPASSRLS)
          psql -h localhost -U postgres -d fluxbase_go_e2e -c "CREATE USER fluxbase_rls_test WITH PASSWORD 'fluxbase_rls_test_password' LOGIN NOBYPASSRLS CREATEDB;"
          psql -h localhost -U postgres -d fluxbase_go_e2e -c "GRANT ALL PRIVILEGES ON DATABASE fluxbase_go_e2e TO fluxbase_rls_test;"

          # Enable pgvector extension for AI/RAG features
          psql -h localhost -U postgres -d fluxbase_go_e2e -c "CREATE EXTENSION IF NOT EXISTS vector;"

      - name: Start S3 test server (SeaweedFS)
        run: |
          # MinIO no longer publishes pullable images (quay.io/Docker Hub both
          # reject anonymous access), so tests run against SeaweedFS in S3
          # mode. The identity config matches the minioadmin credentials the
          # tests were written with.
          mkdir -p /tmp/seaweed-ci
          cat > /tmp/seaweed-ci/s3.json <<'EOF'
          {"identities":[{"name":"minioadmin","credentials":[{"accessKey":"minioadmin","secretKey":"minioadmin"}],"actions":["Admin","Read","Write","List","Tagging"]}]}
          EOF
          docker run -d --name minio \
            -p 9000:9000 \
            -v /tmp/seaweed-ci/s3.json:/etc/seaweedfs/s3.json:ro \
            chrislusf/seaweedfs:dev \
            server -dir=/data -s3 -s3.port=9000 -s3.config=/etc/seaweedfs/s3.json -master.volumeSizeLimitMB=1024
          timeout 60 bash -c 'until curl -s http://localhost:9000/ > /dev/null 2>&1; do sleep 1; done'

      - name: Setup MinIO bucket
        run: |
          # Pre-create the default test bucket via the SeaweedFS shell
          # (individual tests create their own buckets as well). The master
          # needs a few seconds for raft leader election after start, so retry.
          for i in $(seq 1 10); do
            if docker exec minio sh -c 'echo "s3.bucket.create -name fluxbase-test" | weed shell -master=localhost:9333' 2>&1 | tee /tmp/bucket.out | grep -qE "created bucket|already exists"; then
              break
            fi
            echo "Bucket setup attempt $i failed — retrying in 3s"
            sleep 3
          done

      - name: Start Dex OIDC provider
        run: |
          docker run -d --name dex \
            -p 5556:5556 \
            -v "$(pwd)/test/e2e/dex-config-ci.yaml:/etc/dex/config.yaml:ro" \
            ghcr.io/dexidp/dex:latest \
            dex serve /etc/dex/config.yaml
          # Wait for Dex to be healthy
          for i in $(seq 1 30); do
            if curl -sf http://localhost:5556/dex/healthz > /dev/null 2>&1; then
              echo "Dex is ready"
              break
            fi
            if [ "$i" -eq 30 ]; then
              echo "Dex failed to start"
              docker logs dex
              exit 1
            fi
            sleep 1
          done

      - name: Run integration e2e + internal/auth tests with coverage
        timeout-minutes: 25
        env:
          FLUXBASE_DATABASE_HOST: localhost
          FLUXBASE_DATABASE_PORT: 5432
          FLUXBASE_DATABASE_USER: fluxbase_app
          FLUXBASE_DATABASE_PASSWORD: fluxbase_app_password
          FLUXBASE_DATABASE_ADMIN_USER: postgres
          FLUXBASE_DATABASE_ADMIN_PASSWORD: postgres
          FLUXBASE_TEST_DATABASE: fluxbase_go_e2e
          FLUXBASE_EMAIL_SMTP_HOST: localhost
          FLUXBASE_EMAIL_SMTP_PORT: 1025
          FLUXBASE_STORAGE_S3_ENDPOINT: localhost:9000
          FLUXBASE_STORAGE_S3_ACCESS_KEY: minioadmin
          FLUXBASE_STORAGE_S3_SECRET_KEY: minioadmin
          FLUXBASE_STORAGE_S3_BUCKET: fluxbase-test
          FLUXBASE_SECURITY_SETUP_TOKEN: test-setup-token-e2e-ci
        run: |
          # -p 1 runs the two package binaries sequentially: the e2e suite's
          # TestMain resets the shared database schema, which must not race
          # with the internal/auth tests bootstrapping/provisioning it.
          # Two separate go test invocations: ./test/e2e and ./internal/auth
          # each manage their own connection pools/DB fixtures, and running
          # them in one process let e2e pool teardown close the auth suite's
          # shared connection ('conn closed'). Separate processes isolate that.
          go test -tags=integration -v -race -parallel=1 -p 1 -timeout=15m -coverprofile=coverage-e2e.out -covermode=atomic ./test/e2e/...
          go test -tags=integration -v -race -parallel=1 -p 1 -timeout=10m ./internal/auth/...


  # ===========================================================================
  # Non-short tests for the DB-backed packages. `test-go` runs the full tree
  # with `-short`; tests gated behind testing.Short() only execute here.
  # Same Postgres service pattern as test-go. Runs with -race: these packages
  # hold the REST surface and the tenant/RLS middleware, and their non-short
  # tests are the only place much of that code executes concurrently.
  # ===========================================================================
  test-go-db:
    name: Test Go (DB-backed, non-short)
    needs: changes
    if: >
      github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch' ||
      needs.changes.outputs.go == 'true' ||
      needs.changes.outputs.ci-config == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: ghcr.io/nimbleflux/fluxbase-postgres:${{ inputs.postgres_tag || '18' }}
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: fluxbase_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Get dependencies
        run: |
          go mod download
          go mod verify

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.3

      - name: Set up Node.js for embedded SDK generation
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24.20.0"

      - name: Generate embedded SDK for Jobs runtime
        run: |
          cd sdk
          bun install --frozen-lockfile
          bun run generate:embedded-sdk

      - name: Create dist directory with placeholder for embed directive
        run: |
          mkdir -p internal/adminui/dist
          echo '<!DOCTYPE html><html><head><title>Placeholder</title></head><body></body></html>' > internal/adminui/dist/index.html

      - name: Create test database and users
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -c "CREATE DATABASE fluxbase_go_e2e;"
          psql -h localhost -U postgres -d fluxbase_go_e2e -c "CREATE USER fluxbase_app WITH PASSWORD 'fluxbase_app_password' LOGIN BYPASSRLS CREATEDB CREATEROLE;"
          psql -h localhost -U postgres -d fluxbase_go_e2e -c "GRANT ALL PRIVILEGES ON DATABASE fluxbase_go_e2e TO fluxbase_app;"
          psql -h localhost -U postgres -d fluxbase_go_e2e -c "GRANT ALL ON SCHEMA public TO fluxbase_app;"
          psql -h localhost -U postgres -d fluxbase_go_e2e -c "CREATE SCHEMA IF NOT EXISTS _fluxbase;"
          psql -h localhost -U postgres -d fluxbase_go_e2e -c "GRANT ALL ON SCHEMA _fluxbase TO fluxbase_app;"
          psql -h localhost -U postgres -d fluxbase_go_e2e -c "CREATE EXTENSION IF NOT EXISTS vector;"

      - name: Setup database schema
        env:
          PGPASSWORD: postgres
        run: |
          # Same provisioning as `make test-setup-db`: the DB-backed package
          # tests expect the bootstrap roles and full declarative schema.
          sed "s/{{APP_USER}}/fluxbase_app/g" internal/database/bootstrap/bootstrap.sql | psql -h localhost -U postgres -d fluxbase_go_e2e -v ON_ERROR_STOP=1
          for schema in platform auth storage jobs functions realtime ai rpc app branching logging mcp; do
            sed "s/{{APP_USER}}/fluxbase_app/g" internal/database/schema/schemas/$schema.sql | psql -h localhost -U postgres -d fluxbase_go_e2e || true
          done
          psql -h localhost -U postgres -d fluxbase_go_e2e -f internal/database/schema/schemas/post-schema-fks.sql || true
          psql -h localhost -U postgres -d fluxbase_go_e2e -f internal/database/schema/schemas/post-schema.sql || true
          psql -h localhost -U postgres -d fluxbase_go_e2e -c "GRANT anon, authenticated, service_role, tenant_service TO fluxbase_app;"

      - name: Run DB-backed package tests (non-short)
        timeout-minutes: 30
        env:
          FLUXBASE_DATABASE_HOST: localhost
          FLUXBASE_DATABASE_PORT: 5432
          FLUXBASE_DATABASE_USER: fluxbase_app
          FLUXBASE_DATABASE_PASSWORD: fluxbase_app_password
          FLUXBASE_DATABASE_ADMIN_USER: postgres
          FLUXBASE_DATABASE_ADMIN_PASSWORD: postgres
          FLUXBASE_DATABASE_DATABASE: fluxbase_go_e2e
          FLUXBASE_TEST_DATABASE: fluxbase_go_e2e
          SKIP_MIGRATIONS: "true"
        run: |
          go test -v -race -timeout=25m ./internal/middleware/... ./internal/api/... ./internal/ai/...


  # ===========================================================================
  # Contract-drift: the committed TypeScript types in sdk/src/types-generated.ts
  # must match the OpenAPI spec the Go server actually serves. Nothing checked
  # the two halves against each other before, which let Go<->TS wire-shape
  # drift reach runtime (issue #382). This job boots a fresh server with the
  # same postgres + build steps as the Go jobs and runs
  # scripts/check-contract-drift.sh against it (issue #408).
  #
  # Not in branch protection's required checks yet — add it once proven
  # stable (flip by editing the GitHub ruleset, no workflow change needed).
  # ===========================================================================
  contract-drift:
    name: Contract Drift (OpenAPI <-> TS types)
    needs: changes
    if: >
      github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch' ||
      needs.changes.outputs.go == 'true' ||
      needs.changes.outputs.sdk == 'true' ||
      needs.changes.outputs.ci-config == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: ghcr.io/nimbleflux/fluxbase-postgres:${{ inputs.postgres_tag || '18' }}
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: fluxbase_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Get dependencies
        run: |
          go mod download
          go mod verify

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.3

      - name: Set up Node.js for embedded SDK generation
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24.20.0"

      - name: Generate embedded SDK for Jobs runtime
        run: |
          cd sdk
          bun install --frozen-lockfile
          bun run generate:embedded-sdk

      - name: Install Deno
        # The server requires a deno binary for the functions/jobs module
        # loader; without it the process exits at boot (FTL "deno executable
        # not found").
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.7

      - name: Create dist directory with placeholder for embed directive
        run: |
          mkdir -p internal/adminui/dist
          echo '<!DOCTYPE html><html><head><title>Placeholder</title></head><body></body></html>' > internal/adminui/dist/index.html

      - name: Install workspace dependencies
        # Installs root devDependencies (openapi-typescript, prettier) used by
        # scripts/check-contract-drift.sh.
        run: bun install --frozen-lockfile

      - name: Create database and app user
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -c "CREATE DATABASE fluxbase_drift;"
          psql -h localhost -U postgres -d fluxbase_drift -c "CREATE USER fluxbase_app WITH PASSWORD 'fluxbase_app_password' LOGIN BYPASSRLS CREATEDB CREATEROLE;"
          psql -h localhost -U postgres -d fluxbase_drift -c "GRANT ALL PRIVILEGES ON DATABASE fluxbase_drift TO fluxbase_app;"

      - name: Provision database schema
        env:
          PGPASSWORD: postgres
        run: |
          # The schema is provisioned with psql (same as the test-go-db job)
          # instead of relying on the server's boot-time declarative apply:
          # that apply skips failed statements under transient connection
          # errors, which made a single fresh boot's table set
          # nondeterministic — and this check compares the exact table set.
          # The server still applies the declarative schema on boot; against
          # an existing schema every statement is an idempotent no-op.
          sed "s/{{APP_USER}}/fluxbase_app/g" internal/database/bootstrap/bootstrap.sql | psql -h localhost -U postgres -d fluxbase_drift -v ON_ERROR_STOP=1
          for schema in platform auth storage jobs functions realtime ai rpc app branching logging mcp; do
            sed "s/{{APP_USER}}/fluxbase_app/g" internal/database/schema/schemas/$schema.sql | psql -h localhost -U postgres -d fluxbase_drift || true
          done
          psql -h localhost -U postgres -d fluxbase_drift -f internal/database/schema/schemas/post-schema-fks.sql || true
          psql -h localhost -U postgres -d fluxbase_drift -f internal/database/schema/schemas/post-schema.sql || true
          psql -h localhost -U postgres -d fluxbase_drift -c "CREATE SCHEMA IF NOT EXISTS _fluxbase;"
          psql -h localhost -U postgres -d fluxbase_drift -c "GRANT ALL ON SCHEMA _fluxbase TO fluxbase_app;"
          psql -h localhost -U postgres -d fluxbase_drift -c "GRANT anon, authenticated, service_role, tenant_service TO fluxbase_app;"

      - name: Build and start Go backend
        env:
          FLUXBASE_DATABASE_HOST: localhost
          FLUXBASE_DATABASE_PORT: 5432
          FLUXBASE_DATABASE_USER: fluxbase_app
          FLUXBASE_DATABASE_PASSWORD: fluxbase_app_password
          FLUXBASE_DATABASE_ADMIN_USER: postgres
          FLUXBASE_DATABASE_ADMIN_PASSWORD: postgres
          FLUXBASE_DATABASE_DATABASE: fluxbase_drift
          FLUXBASE_SERVER_ADDRESS: ":8082"
          FLUXBASE_BASE_URL: "http://localhost:8082"
          FLUXBASE_ADMIN_ENABLED: "true"
          FLUXBASE_AUTH_JWT_SECRET: Kx9vM2nR7pQ4wT8yB3fJ6hL0zA5cD1eG
          FLUXBASE_ENCRYPTION_KEY: "a1b2c3d4e5f6a7b8c9d0e1f2a3b4c5d6"
          FLUXBASE_SECURITY_SETUP_TOKEN: contract-drift-ci-setup-token-32-chars
        run: |
          go build -o /tmp/fluxbase-contract-drift cmd/fluxbase/main.go

          GOGC=50 /tmp/fluxbase-contract-drift >> /tmp/fluxbase-contract-drift.log 2>&1 &

          # Wait for the server to be ready (health check + bootstrap complete).
          # A fresh boot applies the declarative schema before the listener
          # starts; on hosted runners this can take a few minutes (the
          # docker-smoke job documents the same 300s /health window).
          for i in $(seq 1 150); do
            if curl -sf http://localhost:8082/health > /dev/null 2>&1; then
              SETUP_STATUS=$(curl -sf http://localhost:8082/api/v1/admin/setup/status 2>/dev/null || echo "")
              if echo "$SETUP_STATUS" | grep -q '"needs_setup"'; then
                echo "Go backend ready on :8082 (bootstrap complete)"
                break
              fi
              echo "Health OK, waiting for bootstrap to finish..."
            fi
            if [ "$i" -eq 150 ]; then
              echo "Backend failed to start within 300s"
              cat /tmp/fluxbase-contract-drift.log
              exit 1
            fi
            sleep 2
          done

      - name: Complete initial setup (full OpenAPI spec requires an admin JWT)
        env:
          SETUP_TOKEN: contract-drift-ci-setup-token-32-chars
        run: |
          # A successful setup writes to platform.users and system settings,
          # so it doubles as proof the boot migrations finished. Retry to stay
          # robust against a health/step race right at the end of the boot.
          TOKEN=""
          for attempt in $(seq 1 6); do
            TOKEN=$(curl -sf -X POST http://localhost:8082/api/v1/admin/setup \
              -H "Content-Type: application/json" \
              -d '{"setup_token":"'"$SETUP_TOKEN"'","email":"ci-drift@example.com","password":"CiDrift!2026x","name":"CI Drift"}' \
              | jq -r '.access_token // empty') || true
            if [ -n "$TOKEN" ]; then
              echo "Setup succeeded (attempt $attempt)"
              break
            fi
            if [ "$attempt" -eq 6 ]; then
              echo "Failed to obtain admin token from /api/v1/admin/setup"
              exit 1
            fi
            echo "Setup attempt $attempt failed; retrying in 5s"
            sleep 5
          done
          echo "CONTRACT_DRIFT_TOKEN=$TOKEN" >> "$GITHUB_ENV"

      - name: Check contract drift
        run: scripts/check-contract-drift.sh http://localhost:8082

      - name: Upload drift artifacts
        # The generated + normalized files and the served spec: makes a drift
        # failure reviewable (or regenerable with --update) without re-running
        # the whole job.
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: contract-drift-generated-types
          path: /tmp/openapi-drift/
          retention-days: 7

      - name: Upload server logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: contract-drift-server-logs
          path: /tmp/fluxbase-contract-drift.log
          retention-days: 7

  # ===========================================================================
  # Version drift: the version is duplicated across VERSION, Chart.yaml, the
  # compose fallbacks, .env.example, the SDK package.jsons, the docs install
  # pin, and the Helm postgres pin. scripts/set-version.sh is the single
  # writer for all of them (used by `make bump-*` locally and by the release
  # workflow). This job re-applies the LATEST RELEASE TAG's version to a
  # clean tree: on a healthy tree that is a no-op, because the release
  # workflow's version-bump commit already left the tree in exactly that
  # state. Hand-edits to any copy (or missed syncs) fail here with the fix
  # spelled out — same philosophy as contract-drift above.
  # ===========================================================================
  version-drift:
    name: Version Drift (set-version.sh idempotence)
    needs: changes
    # Always on main (the release commit must be verified); on PRs only when
    # a version-carrying file changed — an always-on gate would fail every
    # open PR right after each release, until the PR merges main.
    if: >
      github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch' ||
      needs.changes.outputs.version-files == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0 # tags: the expected tree state is "matches latest release tag"

      - name: Check version-file consistency
        run: |
          # The expected tree state is "self-consistent at the NEWEST of the
          # VERSION file and the latest release tag": normally they are equal,
          # but in a release window the bump commit lands before (or, if a
          # release is re-cut, after) the tag, so the tree is legitimately one
          # step ahead. A tree that lags the tag, or mixed copies, still fail.
          git fetch --tags --force
          LATEST_TAG_VERSION=$(git tag -l 'v*' | sort -V | tail -n1 | sed 's/^v//')
          [ -n "$LATEST_TAG_VERSION" ] || LATEST_TAG_VERSION=$(cat VERSION)
          TARGET=$(printf '%s\n%s\n' "$(cat VERSION)" "$LATEST_TAG_VERSION" | sort -V | tail -n1)
          echo "Re-applying version ${TARGET} to a clean tree"
          scripts/set-version.sh "$TARGET" --check

  test-e2e-ui:
    name: Test E2E UI
    needs: changes
    # 'skip-tests' label skips this job (lint and Go tests still run).
    if: >
      !contains(github.event.pull_request.labels.*.name, 'skip-tests') &&
      (github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch' ||
      needs.changes.outputs.admin-ui == 'true' ||
      needs.changes.outputs.e2e-ui == 'true' ||
      needs.changes.outputs.go == 'true' ||
      needs.changes.outputs.ci-config == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 45

    services:
      postgres:
        image: ghcr.io/nimbleflux/fluxbase-postgres:${{ inputs.postgres_tag || '18' }}
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: fluxbase_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      mailhog:
        image: mailhog/mailhog:latest@sha256:8d76a3d4ffa32a3661311944007a415332c4bb855657f4f6c57996405c009bea
        ports:
          - 1025:1025
          - 8025:8025

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Get dependencies
        run: |
          go mod download
          go mod verify

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.3

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24.20.0"

      - name: Install Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.7

      - name: Install workspace dependencies
        run: bun install --frozen-lockfile

      - name: Build SDK
        working-directory: ./sdk
        run: bun run build

      - name: Generate embedded SDK for Jobs runtime
        working-directory: ./sdk
        run: bun run generate:embedded-sdk

      - name: Build SDK React
        working-directory: ./sdk-react
        run: bun run build

      - name: Build Admin UI
        working-directory: ./admin
        run: bun run build

      - name: Copy Admin UI to embedded dist
        run: |
          rm -rf internal/adminui/dist
          cp -r admin/dist internal/adminui/dist

      - name: Increase PostgreSQL max_connections
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d fluxbase_test -c "ALTER SYSTEM SET max_connections = 200;"
          PG_CONTAINER=$(docker ps --format '{{.ID}}' --filter "publish=5432")
          if [ -n "$PG_CONTAINER" ]; then
            docker restart "$PG_CONTAINER"
            sleep 5
            for i in $(seq 1 30); do
              if psql -h localhost -U postgres -d fluxbase_test -c "SELECT 1" > /dev/null 2>&1; then
                echo "PostgreSQL ready with max_connections=200"
                break
              fi
              sleep 1
            done
          fi

      - name: Setup database users
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d fluxbase_test -c "CREATE USER fluxbase_app WITH PASSWORD 'fluxbase_app_password' LOGIN BYPASSRLS CREATEDB CREATEROLE;"
          psql -h localhost -U postgres -d fluxbase_test -c "GRANT ALL PRIVILEGES ON DATABASE fluxbase_test TO fluxbase_app;"
          psql -h localhost -U postgres -d fluxbase_test -c "GRANT ALL ON SCHEMA public TO fluxbase_app;"
          psql -h localhost -U postgres -d fluxbase_test -c "CREATE SCHEMA IF NOT EXISTS _fluxbase;"
          psql -h localhost -U postgres -d fluxbase_test -c "GRANT ALL ON SCHEMA _fluxbase TO fluxbase_app;"
          psql -h localhost -U postgres -d fluxbase_test -c "CREATE EXTENSION IF NOT EXISTS vector;"

      - name: Setup database schema
        env:
          PGPASSWORD: postgres
        run: |
          sed "s/{{APP_USER}}/fluxbase_app/g" internal/database/bootstrap/bootstrap.sql | psql -h localhost -U postgres -d fluxbase_test -v ON_ERROR_STOP=1
          psql -h localhost -U postgres -d fluxbase_test -c "GRANT anon, authenticated, service_role, tenant_service TO fluxbase_app;"
          psql -h localhost -U postgres -d fluxbase_test -c "GRANT ALL ON DATABASE fluxbase_test TO fluxbase_app;"
          psql -h localhost -U postgres -d fluxbase_test -c "GRANT ALL ON SCHEMA public TO fluxbase_app;"

      - name: Apply declarative schema
        env:
          PGPASSWORD: postgres
        run: |
          SCHEMA_DIR="internal/database/schema/schemas"
          for schema in platform auth storage jobs functions realtime ai rpc system migrations app api branching logging mcp; do
            if [ ! -f "${SCHEMA_DIR}/${schema}.sql" ]; then continue; fi
            echo "Applying schema: $schema"
            sed "s/{{APP_USER}}/fluxbase_app/g" "${SCHEMA_DIR}/${schema}.sql" | psql -h localhost -U postgres -d fluxbase_test -v ON_ERROR_STOP=1
          done
          psql -h localhost -U postgres -d fluxbase_test -v ON_ERROR_STOP=1 -f "${SCHEMA_DIR}/post-schema-fks.sql"
          psql -h localhost -U postgres -d fluxbase_test -v ON_ERROR_STOP=1 -f "${SCHEMA_DIR}/post-schema.sql"

      - name: Start S3 test server (SeaweedFS)
        run: |
          # MinIO no longer publishes pullable images (quay.io/Docker Hub both
          # reject anonymous access), so tests run against SeaweedFS in S3
          # mode. The identity config matches the minioadmin credentials the
          # tests were written with.
          mkdir -p /tmp/seaweed-ci
          cat > /tmp/seaweed-ci/s3.json <<'EOF'
          {"identities":[{"name":"minioadmin","credentials":[{"accessKey":"minioadmin","secretKey":"minioadmin"}],"actions":["Admin","Read","Write","List","Tagging"]}]}
          EOF
          docker run -d --name minio \
            -p 9000:9000 \
            -v /tmp/seaweed-ci/s3.json:/etc/seaweedfs/s3.json:ro \
            chrislusf/seaweedfs:dev \
            server -dir=/data -s3 -s3.port=9000 -s3.config=/etc/seaweedfs/s3.json -master.volumeSizeLimitMB=1024
          timeout 60 bash -c 'until curl -s http://localhost:9000/ > /dev/null 2>&1; do sleep 1; done'

      - name: Setup MinIO bucket
        run: |
          # Pre-create the default test bucket via the SeaweedFS shell
          # (individual tests create their own buckets as well). The master
          # needs a few seconds for raft leader election after start, so retry.
          for i in $(seq 1 10); do
            if docker exec minio sh -c 'echo "s3.bucket.create -name fluxbase-test" | weed shell -master=localhost:9333' 2>&1 | tee /tmp/bucket.out | grep -qE "created bucket|already exists"; then
              break
            fi
            echo "Bucket setup attempt $i failed — retrying in 3s"
            sleep 3
          done

      - name: Start Dex OIDC provider
        run: |
          docker run -d --name dex \
            -p 5556:5556 \
            -v "$(pwd)/test/e2e/dex-config-ci.yaml:/etc/dex/config.yaml:ro" \
            ghcr.io/dexidp/dex:latest \
            dex serve /etc/dex/config.yaml
          for i in $(seq 1 30); do
            if curl -sf http://localhost:5556/dex/healthz > /dev/null 2>&1; then
              echo "Dex is ready"
              break
            fi
            if [ "$i" -eq 30 ]; then
              echo "Dex failed to start"
              docker logs dex
              exit 1
            fi
            sleep 1
          done

      - name: Reset database for fresh Playwright setup
        env:
          PGPASSWORD: postgres
        run: |
          # Drop all non-system schemas so the server bootstraps fresh
          # (no admin user → Playwright setup tests see /setup page)
          psql -h localhost -U postgres -d fluxbase_test -c \
            "DO \$\$ DECLARE r RECORD; BEGIN FOR r IN SELECT nspname FROM pg_namespace WHERE nspname NOT IN ('pg_catalog', 'information_schema', 'pg_toast') LOOP EXECUTE 'DROP SCHEMA IF EXISTS ' || quote_ident(r.nspname) || ' CASCADE'; END LOOP; END \$\$;"
          psql -h localhost -U postgres -d fluxbase_test -c \
            "CREATE SCHEMA IF NOT EXISTS public; GRANT ALL ON SCHEMA public TO public;"
          psql -h localhost -U postgres -d fluxbase_test -c \
            "ALTER USER fluxbase_app WITH BYPASSRLS;" 2>/dev/null || true

      - name: Build and start Go backend
        env:
          FLUXBASE_DATABASE_HOST: localhost
          FLUXBASE_DATABASE_PORT: 5432
          FLUXBASE_DATABASE_USER: fluxbase_app
          FLUXBASE_DATABASE_PASSWORD: fluxbase_app_password
          FLUXBASE_DATABASE_ADMIN_USER: postgres
          FLUXBASE_DATABASE_ADMIN_PASSWORD: postgres
          FLUXBASE_DATABASE_DATABASE: fluxbase_test
          FLUXBASE_SERVER_ADDRESS: ":8082"
          FLUXBASE_BASE_URL: "http://localhost:8082"
          FLUXBASE_ADMIN_ENABLED: "true"
          FLUXBASE_AUTH_JWT_SECRET: Kx9vM2nR7pQ4wT8yB3fJ6hL0zA5cD1eG
          FLUXBASE_ENCRYPTION_KEY: "a1b2c3d4e5f6a7b8c9d0e1f2a3b4c5d6"
          FLUXBASE_SECURITY_SETUP_TOKEN: test-setup-token-e2e-ci-32chars-please
          FLUXBASE_EMAIL_SMTP_HOST: localhost
          FLUXBASE_EMAIL_SMTP_PORT: "1025"
          FLUXBASE_STORAGE_S3_ENDPOINT: localhost:9000
          FLUXBASE_STORAGE_S3_ACCESS_KEY: minioadmin
          FLUXBASE_STORAGE_S3_SECRET_KEY: minioadmin
          FLUXBASE_STORAGE_S3_BUCKET: fluxbase-test

          FLUXBASE_FUNCTIONS_ENABLED: "true"
          FLUXBASE_JOBS_ENABLED: "true"
          FLUXBASE_REALTIME_ENABLED: "true"
          FLUXBASE_AI_ENABLED: "true"
          FLUXBASE_RPC_ENABLED: "true"
          FLUXBASE_STORAGE_ENABLED: "true"
        run: |
          # Build the binary with embedded admin UI
          go build -o /tmp/fluxbase-e2e-ui cmd/fluxbase/main.go

          # Start in background
          GOGC=50 /tmp/fluxbase-e2e-ui >> /tmp/fluxbase-e2e-ui.log 2>&1 &
          echo $! > /tmp/fluxbase-e2e-ui.pid

          # Wait for the server to be ready (health check + bootstrap complete)
          for i in $(seq 1 60); do
            if curl -sf http://localhost:8082/health > /dev/null 2>&1; then
              # Health is up — now wait for setup status API to confirm bootstrap is done
              SETUP_STATUS=$(curl -sf http://localhost:8082/api/v1/admin/setup/status 2>/dev/null || echo "")
              if echo "$SETUP_STATUS" | grep -q '"needs_setup"'; then
                echo "Go backend ready on :8082 (bootstrap complete)"
                break
              fi
              echo "Health OK, waiting for bootstrap to finish..."
            fi
            if [ "$i" -eq 60 ]; then
              echo "Backend failed to start within 120s"
              cat /tmp/fluxbase-e2e-ui.log
              exit 1
            fi
            sleep 2
          done

      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('admin/bun.lock') }}

      - name: Install Playwright browsers
        working-directory: ./admin
        run: npx playwright install --with-deps chromium

      - name: Run Playwright E2E tests
        working-directory: ./admin
        env:
          CI: "true"
          PLAYWRIGHT_BASE_URL: http://localhost:8082/admin/
          PLAYWRIGHT_API_URL: http://localhost:8082
          PLAYWRIGHT_BACKEND_PORT: "8082"
          PLAYWRIGHT_DATABASE_NAME: fluxbase_test
          FLUXBASE_SECURITY_SETUP_TOKEN: test-setup-token-e2e-ci-32chars-please
        run: npx playwright test

      - name: Upload Playwright report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: failure()
        with:
          name: playwright-report
          path: admin/playwright-report/
          retention-days: 7

      - name: Upload server logs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: failure()
        with:
          name: e2e-ui-server-logs
          path: /tmp/fluxbase-e2e-ui.log
          retention-days: 7

  build:
    name: Build
    # Runs in parallel with the test jobs, not after them: it validates that
    # the tree cross-compiles, while branch protection requires the test jobs
    # for the merge. Only a lint failure holds it back.
    needs: [changes, lint-go]
    if: >-
      !cancelled() &&
      needs.lint-go.result == 'success' &&
      (github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch' ||
      needs.changes.outputs.code-any == 'true' ||
      needs.changes.outputs.ci-config == 'true')
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
            runner: ubuntu-latest
          - goos: linux
            goarch: arm64
            runner: ubuntu-24.04-arm

    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.3

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24.20.0"

      - name: Install dependencies (workspace)
        run: bun install --frozen-lockfile

      - name: Build SDK
        working-directory: ./sdk
        run: bun run build

      - name: Generate embedded SDK for Jobs runtime
        working-directory: ./sdk
        run: bun run generate:embedded-sdk

      - name: Build SDK React
        working-directory: ./sdk-react
        run: bun run build

      - name: Build Admin UI
        working-directory: ./admin
        run: bun run build

      - name: Copy Admin UI to internal/adminui/dist
        run: |
          mkdir -p internal/adminui/dist
          cp -r admin/dist/* internal/adminui/dist/

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Build server binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          mkdir -p dist
          output_name="fluxbase-server-${{ matrix.goos }}-${{ matrix.goarch }}"
          BUILD_DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          go build -ldflags="-s -w -X github.com/nimbleflux/fluxbase/internal/buildinfo.version=dev-${GITHUB_SHA::8} -X github.com/nimbleflux/fluxbase/internal/buildinfo.commit=${GITHUB_SHA} -X github.com/nimbleflux/fluxbase/internal/buildinfo.buildDate=${BUILD_DATE}" -o "dist/${output_name}" ./cmd/fluxbase

      - name: Build CLI binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          output_name="fluxbase-${{ matrix.goos }}-${{ matrix.goarch }}"
          BUILD_DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          go build -ldflags="-s -w -X github.com/nimbleflux/fluxbase/internal/buildinfo.version=dev-${GITHUB_SHA::8} -X github.com/nimbleflux/fluxbase/internal/buildinfo.commit=${GITHUB_SHA} -X github.com/nimbleflux/fluxbase/internal/buildinfo.buildDate=${BUILD_DATE}" -o "dist/${output_name}" ./cli

      - name: Upload server artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: fluxbase-server-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/fluxbase-server-${{ matrix.goos }}-${{ matrix.goarch }}

      - name: Upload CLI artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: fluxbase-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/fluxbase-${{ matrix.goos }}-${{ matrix.goarch }}

  docker:
    name: Docker Build Test (${{ matrix.flavor }})
    runs-on: ubuntu-latest
    needs: [changes]
    if: >-
      github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch' ||
      needs.changes.outputs.docker == 'true' ||
      needs.changes.outputs.go == 'true' ||
      needs.changes.outputs.ci-config == 'true'
    strategy:
      fail-fast: false
      matrix:
        # Verify both image flavors compile end-to-end. full is the default
        # (CGO + ocr/vips tags); lite is the distroless static build.
        flavor: [full, lite]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Build Docker image (test only, no push)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          platforms: linux/amd64
          push: false
          target: ${{ matrix.flavor == 'lite' && 'runtime-lite' || 'runtime-full' }}
          build-args: |
            FLAVOR=${{ matrix.flavor }}
          cache-from: type=gha,scope=${{ matrix.flavor }}
          cache-to: type=gha,mode=max,scope=${{ matrix.flavor }}
          tags: ghcr.io/${{ github.repository }}:test-${{ matrix.flavor }}

  docker-docs:
    name: Docker Docs Build Test
    runs-on: ubuntu-latest
    needs: [changes, test-sdk]
    if: >-
      !cancelled() &&
      (needs.test-sdk.result == 'success' || needs.test-sdk.result == 'skipped') &&
      github.event_name == 'push' &&
      (needs.changes.outputs.docker == 'true' ||
       needs.changes.outputs.sdk == 'true' ||
       needs.changes.outputs.ci-config == 'true')
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.3

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24.20.0"

      - name: Install dependencies (workspace)
        run: bun install --frozen-lockfile

      - name: Build SDK
        working-directory: ./sdk
        run: bun run build

      - name: Build SDK React
        working-directory: ./sdk-react
        run: bun run build

      - name: Build docs site
        working-directory: ./docs
        run: bun run build

      - name: Check for broken links
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2
        with:
          args: --config .lychee.toml --root-dir ${{ github.workspace }}/docs/dist docs/dist
          fail: true

      - name: Verify build output
        run: |
          # Astro outputs to dist/
          test -f ./docs/dist/index.html || exit 1
          echo "Build output verified: ./docs/dist/index.html exists"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Build docs Docker image (test only, no push)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: ./Dockerfile.docs
          platforms: linux/amd64
          push: false
          cache-from: type=gha,key=docs-
          cache-to: type=gha,mode=max,key=docs-
          tags: ghcr.io/${{ github.repository }}-docs:test

  # ===========================================================================
  # Part G: Compile + test the Go tree with the `ocr vips` build tags.
  #
  # CI normally builds the default (novips) configuration only. The vips build
  # tag was historically broken (duplicate symbols in transform_types.go) and
  # this went undetected because nothing exercised it. This job ensures both
  # build configurations compile and their storage/ai tests pass.
  # ===========================================================================
  test-go-build-tags:
    name: Go Tests (ocr vips tags)
    runs-on: ubuntu-latest
    needs: [changes]
    if: >-
      github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch' ||
      needs.changes.outputs.ocr-go == 'true' ||
      needs.changes.outputs.docker == 'true' ||
      needs.changes.outputs.ci-config == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true

      # The embed directives (internal/runtime/embedded_sdk.js,
      # internal/jobs/embedded_sdk.js, internal/adminui/dist) reference
      # build-generated artifacts that a fresh checkout does not have. Generate
      # them before building — same approach the test-go job uses.
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.3

      - name: Generate embedded SDK for Jobs runtime
        run: |
          cd sdk
          bun install --frozen-lockfile
          bun run generate:embedded-sdk

      - name: Create dist directory with placeholder for embed directive
        run: |
          mkdir -p internal/adminui/dist
          echo '<!DOCTYPE html><html><head><title>Placeholder</title></head><body></body></html>' > internal/adminui/dist/index.html

      # The ocr/vips tags pull in CGO bindings (gosseract, govips) that need
      # the native dev headers to compile.
      - name: Install CGO build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libtesseract-dev libleptonica-dev libvips-dev poppler-utils pkg-config

      - name: Verify full build compiles with -tags "ocr vips"
        run: CGO_ENABLED=1 go build -tags "ocr vips" ./...

      - name: Run storage + ai tests with -tags "ocr vips"
        run: |
          CGO_ENABLED=1 go test -tags "ocr vips" \
            -race \
            -timeout 15m \
            ./internal/storage/... ./internal/ai/...

  # ===========================================================================
  # Part F.4: Setup smoke — verify a fresh Fluxbase stack actually boots and
  # serves traffic, for BOTH image flavors. Builds the image from this branch's
  # source, brings up the stack via the documented docker-compose path, runs
  # scripts/smoke-test.sh, dumps logs on failure, and always tears down.
  # Modeled on the Wayli e2e-setup job.
  # ===========================================================================
  docker-smoke:
    name: Setup Smoke (${{ matrix.flavor }})
    runs-on: ubuntu-latest
    needs: [changes]
    if: >-
      github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch' ||
      needs.changes.outputs.docker == 'true' ||
      needs.changes.outputs.go == 'true' ||
      needs.changes.outputs.ci-config == 'true'
    strategy:
      fail-fast: false
      matrix:
        flavor: [full, lite]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Build Fluxbase image from source
        run: |
          docker build \
            --build-arg FLAVOR=${{ matrix.flavor }} \
            --target ${{ matrix.flavor == 'lite' && 'runtime-lite' || 'runtime-full' }} \
            -t fluxbase-smoke:local-${{ matrix.flavor }} \
            -f Dockerfile .

      # Generate secrets non-interactively (the script's --stdout mode writes a
      # Docker Compose .env with anon + service-role keys + setup token).
      - name: Generate stack secrets
        run: |
          bash deploy/generate-keys.sh --stdout > deploy/.smoke.env

      - name: Bring up the stack
        env:
          FLAVOR: ${{ matrix.flavor }}
          TARGET: ${{ matrix.flavor == 'lite' && 'runtime-lite' || 'runtime-full' }}
        run: |
          # Start detached WITHOUT --wait: the smoke overlay disables the
          # healthcheck (the lite image is distroless and has no wget), and a
          # fresh stack runs ~150 schema migrations on first boot. The
          # smoke-test.sh script polls GET /health (up to 300s) as the real
          # readiness gate.
          docker compose \
            -f deploy/docker-compose.yml \
            -f deploy/docker-compose.smoke.yml \
            --env-file deploy/.smoke.env \
            up -d

      - name: Run setup smoke
        run: |
          bash scripts/smoke-test.sh \
            --flavor ${{ matrix.flavor }} \
            --compose-file deploy/docker-compose.yml \
            --compose-file deploy/docker-compose.smoke.yml

      - name: Dump stack logs on failure
        if: failure()
        run: |
          docker compose \
            -f deploy/docker-compose.yml \
            -f deploy/docker-compose.smoke.yml \
            --env-file deploy/.smoke.env \
            logs --tail=200 || true

      # ALWAYS tear down: destroy containers, volumes, and the isolated network.
      - name: Tear down the stack
        if: always()
        run: |
          docker compose \
            -f deploy/docker-compose.yml \
            -f deploy/docker-compose.smoke.yml \
            --env-file deploy/.smoke.env \
            down -v --remove-orphans || true
