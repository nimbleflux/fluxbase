name: Build CI Postgres Image

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Custom tag for the image (e.g., add-new-feature)"
        required: true
        type: string
      postgres_version:
        description: "PostgreSQL version (default: latest in postgres/versions.json)"
        required: false
        type: string
      postgres_major:
        description: "PostgreSQL major version (default: latest major in postgres/versions.json)"
        required: false
        type: string

permissions:
  packages: write

jobs:
  build:
    name: Build Postgres Image for CI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Resolve default versions from versions.json
        id: versions
        run: |
          latest=$(jq -c '.versions[] | select(.latest == true)' postgres/versions.json)
          echo "version=$(jq -r '.version' <<<"$latest")" >> "$GITHUB_OUTPUT"
          echo "major=$(jq -r '.major' <<<"$latest")" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: ./postgres
          file: ./postgres/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/fluxbase-postgres:${{ inputs.tag }}
          build-args: |
            POSTGRES_VERSION=${{ inputs.postgres_version || steps.versions.outputs.version }}
            POSTGRES_MAJOR=${{ inputs.postgres_major || steps.versions.outputs.major }}
          cache-from: type=gha,scope=postgres-ci
          cache-to: type=gha,mode=max,scope=postgres-ci

      - name: Summary
        run: |
          echo "### CI Postgres Image Built" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Image: \`ghcr.io/${{ github.repository_owner }}/fluxbase-postgres:${{ inputs.tag }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "To use this image in CI, trigger the CI workflow with:" >> $GITHUB_STEP_SUMMARY
          echo "- \`postgres_tag\`: \`${{ inputs.tag }}\`" >> $GITHUB_STEP_SUMMARY
