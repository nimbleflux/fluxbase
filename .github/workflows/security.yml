name: Security Scan

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  schedule:
    # Run daily at 2 AM UTC
    - cron: "0 2 * * *"

permissions:
  contents: read

jobs:
  trivy-scan:
    name: Trivy Vulnerability Scanner
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Run Trivy filesystem scanner
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: "fs"
          scan-ref: "."
          format: "sarif"
          output: "trivy-results.sarif"
          severity: "CRITICAL,HIGH"

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: "trivy-results.sarif"

      - name: Run Trivy vulnerability scanner (table format, gates the job)
        # Gating scan: fails the job on CRITICAL/HIGH findings. The SARIF scan
        # above has no exit-code so the upload still happens (its step is
        # `if: always()`).
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: "fs"
          scan-ref: "."
          format: "table"
          severity: "CRITICAL,HIGH"
          exit-code: "1"

  govulncheck-scan:
    name: Go Vulnerability Check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libvips-dev pkg-config

      - name: Create placeholder embed files
        run: |
          # Create placeholder files for Go embed directives
          # These files are generated during actual build, but we need stubs for govulncheck
          mkdir -p internal/adminui/dist
          echo "<!DOCTYPE html><html><body>placeholder</body></html>" > internal/adminui/dist/index.html
          echo "// placeholder SDK" > internal/runtime/embedded_sdk.js

      - name: Install govulncheck
        # Pinned (was @latest) so scan behavior is reproducible; bump deliberately.
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.8.0

      - name: Run govulncheck (SARIF format)
        id: govulncheck
        # No continue-on-error: the script below handles tool failures itself
        # and always emits a valid SARIF file, so the step only fails on
        # unexpected conditions. Vulnerability findings do not fail this step
        # (govulncheck writes findings to the SARIF output); the text run
        # below is the gate.
        run: |
          govulncheck -format sarif ./... > govulncheck-results.sarif 2>&1 || {
            echo "govulncheck encountered errors, but continuing..."
            # Ensure we have a valid SARIF file even on error
            if [ ! -s govulncheck-results.sarif ] || ! grep -q '"version"' govulncheck-results.sarif 2>/dev/null; then
              echo '{"version":"2.1.0","$schema":"https://json.schemastore.org/sarif-2.1.0.json","runs":[{"tool":{"driver":{"name":"govulncheck"}},"results":[]}]}' > govulncheck-results.sarif
            fi
          }

      - name: Deduplicate SARIF stacks
        # govulncheck emits identical call-stack entries that the upload API
        # rejects ("stacks contains duplicate item") and emits "stacks": null for
          # module-level (uncalled) findings; drop null stacks and dedupe arrays.
        if: always() && hashFiles('govulncheck-results.sarif') != ''
        run: |
          jq '.runs[].results |= map(if (.stacks | type) == "array" then .stacks |= unique else delpaths([["stacks"]]) end)'             govulncheck-results.sarif > govulncheck-results.dedup.sarif
          mv govulncheck-results.dedup.sarif govulncheck-results.sarif

      - name: Upload govulncheck results to GitHub Security
        uses: github/codeql-action/upload-sarif@v4
        if: always() && hashFiles('govulncheck-results.sarif') != ''
        with:
          sarif_file: govulncheck-results.sarif

      - name: Run govulncheck (text format, gates the job)
        # No continue-on-error: vulnerabilities reachable from this code
        # (govulncheck exits 3) fail the job, matching the Trivy
        # exit-code policy above. IDs in .govulncheck-waivers are accepted
        # risks (upstream fix unavailable) and do not gate — re-review them
        # periodically.
        run: |
          govulncheck ./... > govulncheck.out 2>&1 || true
          if grep "Vulnerability #" govulncheck.out | grep -vFf .govulncheck-waivers >/dev/null; then
            cat govulncheck.out
            echo "::error::Reachable vulnerabilities without a waiver were found"
            exit 1
          fi
          cat govulncheck.out

  codeql:
    name: CodeQL Analysis (Go)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod

      - name: Create placeholder embed files
        run: |
          # CodeQL builds the Go tree; the embed directives reference
          # build-generated artifacts a fresh checkout does not have.
          mkdir -p internal/adminui/dist
          echo "<!DOCTYPE html><html><body>placeholder</body></html>" > internal/adminui/dist/index.html
          echo "// placeholder SDK" > internal/runtime/embedded_sdk.js

      - name: Initialize CodeQL
        uses: github/codeql-action/init@24c54180a607b1449ed407dd24f251e4e9147c8d # v4
        with:
          languages: go
          build-mode: autobuild

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@24c54180a607b1449ed407dd24f251e4e9147c8d # v4
        with:
          category: "/language:go"

  gitleaks:
    name: Secret Scanning (gitleaks)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Full history so gitleaks scans every commit, not just the push
          # shallow clone. NOTE: an audit verified the repo currently has no
          # real secrets in history — the scan is purely preventive.
          fetch-depth: 0

      - name: Install gitleaks (pinned binary - gitleaks-action requires an org license)
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz" | tar -xz -C /tmp gitleaks
          install -m 0755 /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Run gitleaks
        run: gitleaks detect --source . --redact --verbose --no-banner
