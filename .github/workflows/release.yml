name: Release

# This workflow handles all release types: stable releases and release candidates (RC)
#
# Trigger:
#   Manual workflow_dispatch ONLY — this workflow is the single release entry
#   point. It creates the annotated tag itself, so pushing a tag by hand does
#   nothing (and can no longer race this pipeline or re-create the old
#   "stray branch named after a tag" bug). See RELEASING.md for the runbook,
#   or run `make release TYPE=rc|stable` from main.
#
# Version is automatically calculated based on last release:
#   - stable → rc/stable: New release (YYYY.MM.N with incremented iteration)
#   - rc → rc: Continue RC series (increment RC number)
#   - rc → stable: Promote RC to stable (remove -rc.N suffix)
#
# CalVer Examples:
#   - v2026.01.1 (stable) + rc → v2026.01.2-rc.1 (new RC for next iteration)
#   - v2026.01.1 (stable) + stable → v2026.01.2 (new stable release)
#   - v2026.01.1-rc.3 + rc → v2026.01.1-rc.4 (continue RC series)
#   - v2026.01.1-rc.5 + stable → v2026.01.1 (promote to stable)
#
# Component Toggles:
#   - Publish binaries: Build and publish Go binaries (server: linux amd64+arm64
#     with OCR/vips; CLI: linux/darwin/windows) + SLSA provenance attestations
#   - Publish Docker image: Build and push the main Fluxbase Docker image
#   - Publish docs Docker image: Build and push the documentation site image
#   - Publish NPM SDK packages: Publish TypeScript and React SDK packages to NPM
#   - Publish Kotlin SDK: Publish fluxbase-kotlin to GitHub Packages (Maven)
#   - Publish Go module: Notify pkg.go.dev to index the new Go module version
#   - Publish Helm chart: Package and publish Helm chart to GHCR and GitHub Pages
#   - Publish Postgres images: Build and push fluxbase-postgres images for all supported versions
#   Note: CLI binaries are always published as part of "Publish binaries"
#
# Dry runs:
#   Set dry_run=true to rehearse the full release with zero side effects:
#   everything is built and verified, binaries land as workflow artifacts,
#   images are loaded locally, and nothing is tagged, pushed, or published.
#
# Reliability model:
#   - Every publish step is idempotent: after a partial failure, re-run the
#     failed jobs from the Actions UI and already-published pieces are skipped.
#   - Post-release smoke tests can FAIL the run and open a `release-blocker`
#     issue, which gates the next release via pre-release-checks.
#   - skip_validation is rejected outright for stable releases.
#
# RC Release behavior:
#   - Version format: vYYYY.MM.N-rc.N (e.g., v2026.01.1-rc.1, v2026.01.1-rc.2)
#   - Marked as GitHub pre-release
#   - Docker images tagged with version and 'rc' (NOT 'latest')
#   - NPM packages published with 'rc' dist-tag (NOT 'latest')
#   - Helm charts published with prerelease annotation (filtered by default, opt-in with --devel)
#   - Binaries and Go module are published normally
#
# Stable Release behavior:
#   - Version format: vYYYY.MM.N (e.g., v2026.01.1)
#   - Marked as GitHub release (not pre-release)
#   - Docker images tagged with version, YYYY.MM, YYYY, and 'latest'
#   - NPM packages published with 'latest' dist-tag
#   - Helm charts published to GHCR and GitHub Pages
#   - All artifacts published normally

on:
  workflow_dispatch:
    inputs:
      release_type:
        description: "Release type"
        required: true
        type: choice
        options:
          - rc
          - stable
        default: "rc"
      publish_binaries:
        description: "Publish binaries"
        required: false
        type: boolean
        default: true
      publish_docker:
        description: "Publish Docker image"
        required: false
        type: boolean
        default: true
      publish_docs:
        description: "Publish docs Docker image"
        required: false
        type: boolean
        default: true
      publish_npm_sdk:
        description: "Publish NPM SDK packages"
        required: false
        type: boolean
        default: true
      publish_go_module:
        description: "Publish Go module"
        required: false
        type: boolean
        default: true
      publish_helm:
        description: "Publish Helm chart"
        required: false
        type: boolean
        default: true
      publish_kotlin_sdk:
        description: "Publish Kotlin SDK to GitHub Packages"
        required: false
        type: boolean
        default: true
      publish_postgres:
        description: "Publish Postgres Docker images"
        required: false
        type: boolean
        default: false
      skip_validation:
        description: "Skip pre-release validation (RC only; rejected for stable)"
        required: false
        type: boolean
        default: false
      generate_ai_notes:
        description: "Prepend an optional AI summary to the generated release notes"
        required: false
        type: boolean
        default: false
      dry_run:
        description: "Rehearse the release: build and verify everything, publish nothing"
        required: false
        type: boolean
        default: false

# One release at a time: concurrent dispatches would race on tag creation,
# version-file commits to the source branch, and the gh-pages Helm index.
# Queued runs (not cancelled) preserve release ordering.
concurrency:
  group: release
  cancel-in-progress: false

# Least privilege: default is read-only; each job that writes something
# (releases/tags/git pushes, GHCR images, cosign signing) grants exactly what
# it needs below. id-token: write appears ONLY on jobs that cosign-sign pushed
# images (keyless Sigstore signing needs OIDC) — nothing else uses OIDC.
permissions:
  contents: read

jobs:
  get-version:
    name: Get Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get_version.outputs.version }}
      tag_name: ${{ steps.get_version.outputs.tag_name }}
      is_prerelease: ${{ steps.get_version.outputs.is_prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0 # Fetch all history for all tags

      - name: Get version
        id: get_version
        run: |
          # Fetch all tags from remote to ensure we have the latest state
          git fetch --tags --force

          # Get latest tag (sorted by version, not by commit date)
          LATEST_TAG=$(git tag -l 'v*' | sort -V | tail -n1)
          LATEST_TAG=${LATEST_TAG:-v0.0.0}
          LATEST_VERSION=${LATEST_TAG#v}

          # Parse version components - support both SemVer (for migration) and CalVer
          if [[ "$LATEST_VERSION" =~ ^([0-9]{4})\.([0-9]+)\.([0-9]+)(-rc\.([0-9]+))?$ ]]; then
            # CalVer format: YYYY.MM.N[-rc.N]
            YEAR="${BASH_REMATCH[1]}"
            MONTH="${BASH_REMATCH[2]}"
            ITERATION="${BASH_REMATCH[3]}"
            RC_NUM="${BASH_REMATCH[5]:-0}"
            IS_CALVER=true
          elif [[ "$LATEST_VERSION" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)(-rc\.([0-9]+))?$ ]]; then
            # SemVer format (for migration from 0.0.1 to CalVer)
            # Treat as if it's old version, force new CalVer
            IS_CALVER=false
          else
            # Fallback for malformed versions
            IS_CALVER=false
          fi

          # Determine new version based on last release type and desired release type
          RELEASE_TYPE="${{ github.event.inputs.release_type }}"

          # Get current date for CalVer
          CURRENT_YEAR=$(date +%Y)
          CURRENT_MONTH=$(date +%-m)  # %-m removes leading zero (1-12)

          # Determine if we should continue existing RC series or start fresh
          if [[ "$LATEST_VERSION" =~ -rc\.([0-9]+)$ ]]; then
            LAST_IS_RC=true
            RC_NUM="${BASH_REMATCH[1]}"
          else
            LAST_IS_RC=false
            RC_NUM=0
          fi

          # Auto-deduce version_type based on last release and desired release
          if [ "$LAST_IS_RC" = true ] && [ "$RELEASE_TYPE" = "rc" ]; then
            # rc → rc: Continue same RC series (increment RC number)
            BASE_YEAR="$YEAR"
            BASE_MONTH="$MONTH"
            BASE_ITERATION="$ITERATION"
            MODE="continue_rc"

            # Check if stable version of this base already exists
            # If so, we need to start a new RC series for the next iteration
            if git rev-parse "v${BASE_YEAR}.${BASE_MONTH}.${BASE_ITERATION}" >/dev/null 2>&1; then
              echo "Stable version v${BASE_YEAR}.${BASE_MONTH}.${BASE_ITERATION} already exists, incrementing iteration"
              BASE_ITERATION="$((BASE_ITERATION + 1))"
              MODE="new"
            fi
          elif [ "$LAST_IS_RC" = true ] && [ "$RELEASE_TYPE" = "stable" ]; then
            # rc → stable: Promote RC to stable
            # Check if RC is from a previous month - if so, start fresh with current month
            if [ "$IS_CALVER" = true ] && ([ "$YEAR" -ne "$CURRENT_YEAR" ] || [ "$MONTH" -ne "$CURRENT_MONTH" ]); then
              # RC is from a different month, start fresh with current date
              echo "RC is from a different month ($YEAR.$MONTH), starting fresh with current month"
              BASE_YEAR="$CURRENT_YEAR"
              BASE_MONTH="$CURRENT_MONTH"
              BASE_ITERATION="1"
              MODE="new"
            else
              # Same month: promote RC to stable
              BASE_YEAR="$YEAR"
              BASE_MONTH="$MONTH"
              BASE_ITERATION="$ITERATION"
              MODE="promote_rc"

              # Check if stable version already exists
              if git rev-parse "v${BASE_YEAR}.${BASE_MONTH}.${BASE_ITERATION}" >/dev/null 2>&1; then
                echo "Stable version v${BASE_YEAR}.${BASE_MONTH}.${BASE_ITERATION} already exists, incrementing iteration"
                BASE_ITERATION="$((BASE_ITERATION + 1))"
                MODE="new"
              fi
            fi
          else
            # stable → rc OR stable → stable: Start new release (increment iteration)
            # Use numeric comparison (-eq) to handle leading zeros correctly
            if [ "$IS_CALVER" = true ] && [ "$YEAR" -eq "$CURRENT_YEAR" ] && [ "$MONTH" -eq "$CURRENT_MONTH" ]; then
              # Same month: increment iteration
              BASE_ITERATION="$((ITERATION + 1))"
              BASE_YEAR="$YEAR"
              BASE_MONTH="$MONTH"
            else
              # Different month or no CalVer: start fresh with current date
              BASE_YEAR="$CURRENT_YEAR"
              BASE_MONTH="$CURRENT_MONTH"
              BASE_ITERATION="1"
            fi
            MODE="new"
          fi

          # Apply release type
          if [ "$RELEASE_TYPE" = "rc" ]; then
            if [ "$MODE" = "continue_rc" ]; then
              # Continue existing RC series: increment RC number
              NEW_VERSION="${BASE_YEAR}.${BASE_MONTH}.${BASE_ITERATION}-rc.$((RC_NUM + 1))"
            else
              # Start new RC series
              NEW_VERSION="${BASE_YEAR}.${BASE_MONTH}.${BASE_ITERATION}-rc.1"
            fi
            IS_PRERELEASE="true"
          else
            # Stable release
            NEW_VERSION="${BASE_YEAR}.${BASE_MONTH}.${BASE_ITERATION}"
            IS_PRERELEASE="false"
          fi

          VERSION="v${NEW_VERSION}"
          echo "tag_name=${VERSION}" >> $GITHUB_OUTPUT
          echo "version=${NEW_VERSION}" >> $GITHUB_OUTPUT
          echo "is_prerelease=${IS_PRERELEASE}" >> $GITHUB_OUTPUT

  # ===========================================================================
  # PRE-RELEASE VALIDATION
  # ===========================================================================
  pre-release-checks:
    name: Pre-release Validation
    needs: get-version
    runs-on: ubuntu-latest
    # Always runs on dispatch: this is where skip_validation abuse is rejected.
    # Stable releases can NEVER skip validation; RCs may.
    if: github.event_name == 'workflow_dispatch'
    # gh run list (actions: read) and gh issue list (issues: read)
    permissions:
      contents: read
      actions: read
      issues: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Enforce skip_validation policy
        env:
          SKIP_VALIDATION: ${{ inputs.skip_validation }}
          RELEASE_TYPE: ${{ inputs.release_type }}
        run: |
          if [ "$SKIP_VALIDATION" != "true" ]; then
            echo "Full validation enabled"
            exit 0
          fi
          if [ "$RELEASE_TYPE" = "stable" ]; then
            echo "::error::skip_validation is not allowed for stable releases. Cut an RC first (or run with validation)."
            exit 1
          fi
          echo "skip_validation allowed for RC release"

      - name: Check CI workflow status
        if: ${{ !inputs.skip_validation }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "Checking CI status for branch: ${{ github.ref_name }}"

          # Get the latest CI workflow run for this branch
          LATEST_RUN=$(gh run list \
            --workflow=ci.yml \
            --branch=${{ github.ref_name }} \
            --limit=1 \
            --json conclusion,headSha,status,createdAt \
            --jq '.[0]')

          if [ -z "$LATEST_RUN" ] || [ "$LATEST_RUN" = "null" ]; then
            echo "::error::No CI workflow runs found for branch ${{ github.ref_name }}"
            exit 1
          fi

          CONCLUSION=$(echo "$LATEST_RUN" | jq -r '.conclusion')
          STATUS=$(echo "$LATEST_RUN" | jq -r '.status')
          HEAD_SHA=$(echo "$LATEST_RUN" | jq -r '.headSha')
          CREATED_AT=$(echo "$LATEST_RUN" | jq -r '.createdAt')

          echo "Latest CI run:"
          echo "  Status: $STATUS"
          echo "  Conclusion: $CONCLUSION"
          echo "  Commit: $HEAD_SHA"
          echo "  Created: $CREATED_AT"

          # Check if the CI run is for the current commit
          CURRENT_SHA=$(git rev-parse HEAD)
          if [ "$HEAD_SHA" != "$CURRENT_SHA" ]; then
            echo "::warning::Latest CI run ($HEAD_SHA) is not for current commit ($CURRENT_SHA)"
            echo "Consider running CI on the latest commit before releasing."
          fi

          # Check if CI passed
          if [ "$STATUS" != "completed" ]; then
            echo "::error::CI workflow is still running (status: $STATUS). Wait for completion before releasing."
            exit 1
          fi

          if [ "$CONCLUSION" != "success" ]; then
            echo "::error::CI workflow failed (conclusion: $CONCLUSION). Fix issues before releasing."
            exit 1
          fi

          echo "✅ CI validation passed"

      - name: Check for blocking issues
        if: ${{ !inputs.skip_validation }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Check for any issues labeled as "release-blocker"
          BLOCKERS=$(gh issue list \
            --label "release-blocker" \
            --state open \
            --json number,title \
            --jq 'length')

          if [ "$BLOCKERS" -gt 0 ]; then
            echo "::error::Found $BLOCKERS open release-blocking issues:"
            gh issue list --label "release-blocker" --state open --json number,title --jq '.[] | "  #\(.number): \(.title)"'
            exit 1
          fi

          echo "✅ No release blockers found"

      - name: Check security vulnerabilities
        if: ${{ !inputs.skip_validation }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Check for critical/high security alerts
          echo "Checking for security vulnerabilities..."

          # Get Dependabot alerts (if available)
          ALERTS=$(gh api repos/${{ github.repository }}/dependabot/alerts \
            --jq '[.[] | select(.state == "open" and (.security_vulnerability.severity == "critical" or .security_vulnerability.severity == "high"))] | length' \
            2>/dev/null || echo "0")

          if [ "$ALERTS" -gt 0 ]; then
            echo "::warning::Found $ALERTS critical/high security vulnerabilities. Review before releasing."
          else
            echo "✅ No critical security vulnerabilities found"
          fi

  # ===========================================================================
  # CHANGELOG GENERATION
  # ===========================================================================
  generate-changelog:
    name: Generate Changelog
    needs: get-version
    runs-on: ubuntu-latest
    # Release notes are generated deterministically from the conventional
    # commit history with git-cliff (config: cliff.toml). The optional AI
    # summary is garnish: it is off by default and ANY failure simply omits
    # it — it can never alter or block the release.
    permissions:
      contents: read
    outputs:
      changelog: ${{ steps.changelog.outputs.changelog }}
      ai_summary: ${{ steps.ai_summary.outputs.summary }}
    env:
      GIT_CLIFF_VERSION: v2.14.2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Determine notes range
        id: range
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Anchor stable notes on the last PUBLISHED stable release, not just
          # the last git tag: a tag-only "skipped" release (e.g. v2026.7.3,
          # created as a tag but never published) would otherwise cut the range
          # early and silently drop its commits. Anchoring on published
          # releases rolls those commits into the next real release's notes.
          PREV_TAG=$(gh release list --exclude-drafts --exclude-pre-releases -L 100 \
            --json tagName -q '.[].tagName' | sort -V | tail -n1)

          # Fallback: last non-RC git tag if no published release exists at all
          if [ -z "$PREV_TAG" ]; then
            PREV_TAG=$(git tag -l 'v*' | grep -v '\-rc\.' | sort -V | tail -n1)
          fi
          if [ -z "$PREV_TAG" ]; then
            # If no previous stable tag, use first commit
            PREV_TAG=$(git rev-list --max-parents=0 HEAD)
          fi

          # RC series notes are incremental: continue from the previous RC of
          # the same version series when one exists, so rc.2 doesn't repeat
          # everything rc.1 already listed.
          FROM_TAG="$PREV_TAG"
          VERSION="${{ needs.get-version.outputs.version }}"
          if [[ "$VERSION" =~ ^([0-9]{4}\.[0-9]+\.[0-9]+)-rc\.[0-9]+$ ]]; then
            SERIES="${BASH_REMATCH[1]}"
            LAST_RC=$(git tag -l "v${SERIES}-rc.*" | sort -V | tail -n1)
            if [ -n "$LAST_RC" ] && [ "$LAST_RC" != "v${VERSION}" ]; then
              FROM_TAG="$LAST_RC"
            fi
          fi

          echo "from_tag=$FROM_TAG" >> $GITHUB_OUTPUT
          echo "Notes range: ${FROM_TAG}..HEAD"

      - name: Install git-cliff
        env:
          GH_TOKEN: ${{ github.token }} # cliff enriches entries when available
        run: |
          curl -sSfL \
            "https://github.com/orhun/git-cliff/releases/download/${GIT_CLIFF_VERSION}/git-cliff-${GIT_CLIFF_VERSION#v}-x86_64-unknown-linux-gnu.tar.gz" \
            | tar -xz -C /tmp
          sudo install /tmp/git-cliff-${GIT_CLIFF_VERSION#v}/git-cliff /usr/local/bin/git-cliff
          git-cliff --version

      - name: Generate release notes
        id: changelog
        run: |
          TAG="${{ needs.get-version.outputs.tag_name }}"
          FROM_TAG="${{ steps.range.outputs.from_tag }}"
          mkdir -p .release-notes

          # Deterministic body notes: conventional-commit groups since FROM_TAG.
          git-cliff --config cliff.toml --unreleased --tag "$TAG" "${FROM_TAG}..HEAD" > .release-notes/notes.md

          # Fully regenerated CHANGELOG.md (entire tagged history plus this
          # release). update-version-files commits it via the artifact below.
          git-cliff --config cliff.toml --tag "$TAG" -o .release-notes/CHANGELOG.md

          if [ ! -s .release-notes/notes.md ]; then
            printf '## What'"'"'s Changed\n\n- Maintenance and internal improvements\n' > .release-notes/notes.md
          fi

          {
            echo "changelog<<CHANGELOG_EOF"
            cat .release-notes/notes.md
            echo "CHANGELOG_EOF"
          } >> $GITHUB_OUTPUT

          echo "---- release notes ----"
          cat .release-notes/notes.md

      - name: Upload regenerated CHANGELOG.md
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: changelog-full
          path: .release-notes/CHANGELOG.md
          retention-days: 1
          if-no-files-found: error

      - name: Generate AI summary (optional garnish)
        id: ai_summary
        if: inputs.generate_ai_notes
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          # Garnish, never load-bearing: any failure leaves the summary empty
          # and the release notes stay purely deterministic. The model is a
          # repo variable (Settings → Variables → groq_model) because Groq
          # decommissions models regularly; the default is updated only when
          # needed — no discovery loops that can silently pick junk.
          set +e
          if [ -z "$GROQ_API_KEY" ]; then
            echo "::warning::GROQ_API_KEY secret is not set, skipping AI summary"
            exit 0
          fi

          PREV_TAG="${{ steps.range.outputs.from_tag }}"
          COMMITS=$(git log "$PREV_TAG"..HEAD --oneline 2>/dev/null | head -50)
          CHANGED_FILES=$(git diff --stat "$PREV_TAG"..HEAD 2>/dev/null | tail -1)

          cat > /tmp/prompt.txt << PROMPT_EOF
          Summarize these commits for a release changelog.

          Rules:
          - Focus ONLY on user-facing features and bug fixes
          - Ignore: CI changes, dependency updates, test changes, workflow changes
          - Do NOT mention: GitHub Actions, CI/CD, pipelines, internal tooling, Groq, Claude
          - Do NOT use marketing language like "excited to announce" or "we are pleased"
          - Be factual and concise
          - If there are no significant user-facing changes, just say "Bug fixes and maintenance improvements."

          Commits:
          $COMMITS

          Changed files: $CHANGED_FILES

          Write the summary now (1-2 sentences only):
          PROMPT_EOF

          MODEL="${{ vars.groq_model }}"
          MODEL="${MODEL:-openai/gpt-oss-120b}"
          echo "Using Groq model: $MODEL"

          HTTP_RESPONSE=$(curl -s -w "\n%{http_code}" --max-time 60 https://api.groq.com/openai/v1/chat/completions \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer $GROQ_API_KEY" \
            -d "{
              \"model\": \"$MODEL\",
              \"max_tokens\": 300,
              \"messages\": [{
                \"role\": \"user\",
                \"content\": $(cat /tmp/prompt.txt | jq -Rs .)
              }]
            }")
          HTTP_STATUS=$(echo "$HTTP_RESPONSE" | tail -n1)
          RESPONSE_BODY=$(echo "$HTTP_RESPONSE" | sed '$d')

          if [ "$HTTP_STATUS" != "200" ]; then
            echo "::warning::Groq API returned status $HTTP_STATUS; omitting AI summary"
            exit 0
          fi

          SUMMARY=$(echo "$RESPONSE_BODY" | jq -r '.choices[0].message.content // empty')
          if [ -z "$SUMMARY" ]; then
            echo "::warning::Could not extract summary from API response; omitting AI summary"
            exit 0
          fi

          echo "AI Summary: $SUMMARY"
          {
            echo "summary<<SUMMARY_EOF"
            echo "$SUMMARY"
            echo "SUMMARY_EOF"
          } >> $GITHUB_OUTPUT

  # ===========================================================================
  # CREATE RELEASE
  # ===========================================================================
  create-release:
    name: Create GitHub Release
    needs: [get-version, pre-release-checks, generate-changelog]
    runs-on: ubuntu-latest
    # Creates and pushes the release tag + GitHub release
    permissions:
      contents: write
    if: |
      always() &&
      (needs.pre-release-checks.result == 'success' || needs.pre-release-checks.result == 'skipped') &&
      needs.generate-changelog.result == 'success'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Create and push tag (if not exists)
        if: ${{ !inputs.dry_run }}
        run: |
          TAG_NAME="${{ needs.get-version.outputs.tag_name }}"

          # Fetch all tags from remote to ensure we have the latest state
          git fetch --tags --force

          # Check if tag already exists (e.g. after a re-run following a
          # partial failure — this step is safe to repeat)
          if git rev-parse "$TAG_NAME" >/dev/null 2>&1; then
            echo "Tag $TAG_NAME already exists. Skipping tag creation."
          else
            echo "Creating tag $TAG_NAME..."
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git tag -a "$TAG_NAME" -m "Release $TAG_NAME"
            git push origin "$TAG_NAME"
          fi

      - name: Create GitHub Release with changelog (if not exists)
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
          AI_SUMMARY: ${{ needs.generate-changelog.outputs.ai_summary }}
          CHANGELOG: ${{ needs.generate-changelog.outputs.changelog }}
        run: |
          PRERELEASE_FLAG=""
          if [ "${{ needs.get-version.outputs.is_prerelease }}" = "true" ]; then
            PRERELEASE_FLAG="--prerelease"
          fi

          VERSION="${{ needs.get-version.outputs.version }}"
          TAG="${{ needs.get-version.outputs.tag_name }}"

          # Check if release already exists (idempotent on re-run)
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists. Skipping release creation."
          else
            echo "Creating release $TAG..."

            # Build release notes using environment variables to avoid shell injection issues
            {
              if [ -n "$AI_SUMMARY" ]; then
                printf '%s\n' "$AI_SUMMARY"
                echo ''
              fi
              printf '%s\n' "$CHANGELOG"
              echo ''
              echo '## Installation'
              echo ''
              echo '**Docker:**'
              echo '```bash'
              echo "docker pull ghcr.io/nimbleflux/fluxbase:${VERSION}"
              echo '```'
              echo ''
              echo '**NPM SDK:**'
              echo '```bash'
              echo "npm install @nimbleflux/fluxbase-sdk@${VERSION}"
              echo '```'
              echo ''
              echo '**Helm:**'
              echo '```bash'
              echo "helm install fluxbase oci://ghcr.io/nimbleflux/charts/fluxbase --version ${VERSION}"
              echo '```'
              echo ''
              echo '**CLI:**'
              echo '```bash'
              echo "curl -fsSL https://raw.githubusercontent.com/nimbleflux/fluxbase/main/install-cli.sh | bash -s -- ${TAG}"
              echo '```'
              echo ''
              echo '**Server binary (tarball):** the \`fluxbase-server\` binaries build with the same'
              echo 'OCR and image-transform features as the Docker \`full\` image and link glibc.'
              echo 'Install \`libvips\`, \`tesseract\` and \`ffmpeg\` on the host at runtime, or prefer'
              echo 'the Docker image, which bundles them.'
              echo ''
              echo '---'
              echo '*Release automatically generated by GitHub Actions*'
            } > /tmp/release_notes.md

            gh release create "$TAG" \
              --title "Release $TAG" \
              --notes-file /tmp/release_notes.md \
              $PRERELEASE_FLAG
          fi

      - name: Dry-run summary
        if: inputs.dry_run
        env:
          CHANGELOG: ${{ needs.generate-changelog.outputs.changelog }}
        run: |
          {
            echo "## 🏃 Dry run — nothing was tagged, released, or published"
            echo
            echo "Proposed tag: \`${{ needs.get-version.outputs.tag_name }}\`"
            echo
            printf '%s\n' "$CHANGELOG"
          } >> "$GITHUB_STEP_SUMMARY"

  update-version-files:
    name: Update version in config files
    # Serialized after create-release so the tag exists before the bump
    # commit lands on the branch: CI's version-drift job anchors on the
    # latest tag, and it must never see the bump commit while the matching
    # tag is still in flight.
    needs: [get-version, generate-changelog, create-release]
    runs-on: ubuntu-latest
    # Commits and pushes version bumps to the source branch
    permissions:
      contents: write
    # workflow_dispatch ONLY: this job edits and pushes version files. It used
    # to run on tag-push triggers too, checking out the tag and running
    # `git push origin HEAD:<tag>` — creating a stray branch named after the
    # tag. The workflow is dispatch-only now; this job-level guard keeps it
    # that way even if another trigger is ever re-added. Version bumps belong
    # on the source branch, which workflow_dispatch provides via ref_name.
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.ref_name }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24.20.0"

      - name: Download regenerated CHANGELOG.md
        uses: actions/download-artifact@v8
        with:
          name: changelog-full
          path: .release-notes

      - name: Apply version to files
        env:
          VERSION: ${{ needs.get-version.outputs.version }}
        run: |
          # One script is the single source of truth for every file that
          # carries a version — the same script `make bump-*` runs locally.
          scripts/set-version.sh "$VERSION"
          cp .release-notes/CHANGELOG.md CHANGELOG.md

      - name: Commit version updates
        if: ${{ !inputs.dry_run }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add VERSION CHANGELOG.md \
            deploy/helm/fluxbase/Chart.yaml deploy/helm/fluxbase/values.yaml \
            deploy/docker-compose.yml deploy/docker-compose.minimal.yaml deploy/.env.example \
            sdk/package.json sdk-react/package.json sdk-svelte/package.json \
            sdk-next/package.json sdk-vue/package.json admin/package.json \
            bun.lock docs/src/content/docs/cli/installation.md

          if git diff --staged --quiet; then
            echo "No version changes to commit (idempotent re-run)"
          else
            git commit -m "chore: Update version to ${{ needs.get-version.outputs.version }} in deployment files"
            # main may have moved while this release ran; rebase so the push
            # can't fail on a non-fast-forward mid-release.
            git pull --rebase origin ${{ github.ref_name }}
            git push origin HEAD:${{ github.ref_name }}
          fi

      - name: Dry run — show what would be committed
        if: inputs.dry_run
        run: |
          git add VERSION CHANGELOG.md \
            deploy/helm/fluxbase/Chart.yaml deploy/helm/fluxbase/values.yaml \
            deploy/docker-compose.yml deploy/docker-compose.minimal.yaml deploy/.env.example \
            sdk/package.json sdk-react/package.json sdk-svelte/package.json \
            sdk-next/package.json sdk-vue/package.json admin/package.json \
            bun.lock docs/src/content/docs/cli/installation.md
          echo "## Dry run — version file changes (not committed)" >> "$GITHUB_STEP_SUMMARY"
          echo '```diff' >> "$GITHUB_STEP_SUMMARY"
          git diff --staged --stat >> "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          git reset -q
          echo "(dry run: nothing committed)"

  publish-binaries:
    name: Publish Binaries
    needs: [get-version, create-release]
    if: always() && inputs.publish_binaries && needs.create-release.result == 'success'
    # Uploads assets to the GitHub release; id-token + attestations: write
    # attest SLSA provenance for the archives (parity with the containers):
    # id-token mints the OIDC identity, attestations persists the attestation
    # to the repo attestation store ("Resource not accessible by integration"
    # without it), contents uploads the assets.
    permissions:
      contents: write
      id-token: write
      attestations: write
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
            runner: ubuntu-latest
          - goos: linux
            goarch: arm64
            runner: ubuntu-24.04-arm

    runs-on: ${{ matrix.runner }}
    env:
      VERSION: ${{ needs.get-version.outputs.version }}
      COMMIT_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24.20.0"

      - name: Install dependencies (workspace)
        run: bun install --frozen-lockfile

      - name: Build SDK
        working-directory: ./sdk
        run: |
          bun run build
          bun run generate:embedded-sdk

      - name: Build SDK React
        working-directory: ./sdk-react
        run: bun run build

      - name: Build Admin UI
        working-directory: ./admin
        run: bun run build

      - name: Copy Admin UI to embed location
        run: |
          mkdir -p internal/adminui/dist
          cp -r admin/dist/* internal/adminui/dist/

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod

      - name: Install native dependencies
        run: |
          sudo apt-get update
          # Same dev packages the Dockerfile full builder installs, so the
          # server tarballs have feature parity with the Docker full image
          # (OCR via tesseract, image transforms via libvips).
          sudo apt-get install -y libvips-dev libtesseract-dev libleptonica-dev

      - name: Build server binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 1
        run: |
          BUILD_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          output_name="fluxbase-server-${GOOS}-${GOARCH}"
          # Feature parity with the Docker "full" image
          go build -tags "ocr vips" \
            -ldflags="-s -w -X github.com/nimbleflux/fluxbase/internal/buildinfo.version=${VERSION} -X github.com/nimbleflux/fluxbase/internal/buildinfo.commit=${COMMIT_SHA} -X github.com/nimbleflux/fluxbase/internal/buildinfo.buildDate=${BUILD_DATE}" \
            -o "${output_name}" ./cmd/fluxbase

          # Create checksums
          sha256sum "${output_name}" > "${output_name}.sha256"

          # Create tar.gz for non-Windows
          if [ "${GOOS}" != "windows" ]; then
            tar -czf "${output_name}.tar.gz" "${output_name}"
            sha256sum "${output_name}.tar.gz" > "${output_name}.tar.gz.sha256"
          else
            # Create zip for Windows
            zip "${output_name}.zip" "${output_name}"
            sha256sum "${output_name}.zip" > "${output_name}.zip.sha256"
          fi

      - name: Build CLI binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          BUILD_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          output_name="fluxbase-${GOOS}-${GOARCH}"
          go build -ldflags="-s -w -X github.com/nimbleflux/fluxbase/internal/buildinfo.version=${VERSION} -X github.com/nimbleflux/fluxbase/internal/buildinfo.commit=${COMMIT_SHA} -X github.com/nimbleflux/fluxbase/internal/buildinfo.buildDate=${BUILD_DATE}" \
            -o "${output_name}" ./cli

          # Create checksums
          sha256sum "${output_name}" > "${output_name}.sha256"

          # Create tar.gz for non-Windows
          if [ "${GOOS}" != "windows" ]; then
            tar -czf "${output_name}.tar.gz" "${output_name}"
            sha256sum "${output_name}.tar.gz" > "${output_name}.tar.gz.sha256"
          else
            # Create zip for Windows
            zip "${output_name}.zip" "${output_name}"
            sha256sum "${output_name}.zip" > "${output_name}.zip.sha256"
          fi

      - name: Attest build provenance
        if: ${{ !inputs.dry_run }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: |
            fluxbase-server-${{ matrix.goos }}-${{ matrix.goarch }}.tar.gz
            fluxbase-${{ matrix.goos }}-${{ matrix.goarch }}.*

      - name: Upload Release Assets
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload ${{ needs.get-version.outputs.tag_name }} \
            fluxbase-server-${{ matrix.goos }}-${{ matrix.goarch }}* \
            fluxbase-${{ matrix.goos }}-${{ matrix.goarch }}* \
            --clobber

      - name: Upload build artifacts (dry run)
        if: inputs.dry_run
        uses: actions/upload-artifact@v7
        with:
          name: binaries-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            fluxbase-server-${{ matrix.goos }}-${{ matrix.goarch }}*
            fluxbase-${{ matrix.goos }}-${{ matrix.goarch }}*
          retention-days: 7
          if-no-files-found: error

  publish-cli-cross-platform:
    name: Publish CLI (Cross-Platform)
    needs: [get-version, create-release]
    if: always() && inputs.publish_binaries && needs.create-release.result == 'success'
    # Same permission set as publish-binaries: attestations: write persists
    # the provenance (missing it = "Resource not accessible by integration").
    permissions:
      contents: write
      id-token: write
      attestations: write
    strategy:
      # One failed leg must not cancel the others — each uploads independently.
      fail-fast: false
      matrix:
        include:
          - goos: darwin
            goarch: amd64
            runner: ubuntu-latest
          - goos: darwin
            goarch: arm64
            runner: ubuntu-latest
          - goos: windows
            goarch: amd64
            runner: ubuntu-latest

    runs-on: ${{ matrix.runner }}
    env:
      VERSION: ${{ needs.get-version.outputs.version }}
      COMMIT_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod

      - name: Build CLI binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          BUILD_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          if [ "${GOOS}" = "windows" ]; then
            output_name="fluxbase-${GOOS}-${GOARCH}.exe"
          else
            output_name="fluxbase-${GOOS}-${GOARCH}"
          fi
          go build -ldflags="-s -w -X github.com/nimbleflux/fluxbase/internal/buildinfo.version=${VERSION} -X github.com/nimbleflux/fluxbase/internal/buildinfo.commit=${COMMIT_SHA} -X github.com/nimbleflux/fluxbase/internal/buildinfo.buildDate=${BUILD_DATE}" \
            -o "${output_name}" ./cli

          # Create checksums
          sha256sum "${output_name}" > "${output_name}.sha256"

          # Create archive
          if [ "${GOOS}" = "windows" ]; then
            zip "fluxbase-${GOOS}-${GOARCH}.zip" "${output_name}"
            sha256sum "fluxbase-${GOOS}-${GOARCH}.zip" > "fluxbase-${GOOS}-${GOARCH}.zip.sha256"
          else
            tar -czf "fluxbase-${GOOS}-${GOARCH}.tar.gz" "${output_name}"
            sha256sum "fluxbase-${GOOS}-${GOARCH}.tar.gz" > "fluxbase-${GOOS}-${GOARCH}.tar.gz.sha256"
          fi

      - name: Attest build provenance
        if: ${{ !inputs.dry_run }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: |
            fluxbase-${{ matrix.goos }}-${{ matrix.goarch }}.tar.gz
            fluxbase-${{ matrix.goos }}-${{ matrix.goarch }}.zip

      - name: Upload Release Assets
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload ${{ needs.get-version.outputs.tag_name }} \
            fluxbase-${{ matrix.goos }}-${{ matrix.goarch }}* \
            --clobber

      - name: Upload build artifacts (dry run)
        if: inputs.dry_run
        uses: actions/upload-artifact@v7
        with:
          name: binaries-cli-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            fluxbase-${{ matrix.goos }}-${{ matrix.goarch }}*
          retention-days: 7
          if-no-files-found: error

  publish-docker-arch:
    name: Build Docker Image (${{ matrix.flavor }} / ${{ matrix.arch }})
    needs: get-version
    if: inputs.publish_docker
    # packages: write → GHCR push; id-token: write → cosign keyless signing
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        # Two image flavors from one Dockerfile:
        #   full = default image (OCR + ffmpeg + libvips image transforms)
        #   lite = smaller distroless image (no OCR/ffmpeg/transforms)
        flavor: [full, lite]
        # arch MUST be a matrix key: if it only appears in include entries, all
        # includes merge into the same flavor combo and the last one wins
        # (arm64), silently dropping the amd64 builds.
        arch: [amd64, arm64]
        include:
          - flavor: full
            arch: amd64
            runner: ubuntu-latest
          - flavor: full
            arch: arm64
            runner: ubuntu-24.04-arm
          - flavor: lite
            arch: amd64
            runner: ubuntu-latest
          - flavor: lite
            arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Log in to GitHub Container Registry
        if: ${{ !inputs.dry_run }}
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.flavor }}/${{ matrix.arch }} image
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: Dockerfile
          platforms: linux/${{ matrix.arch }}
          push: ${{ !inputs.dry_run }}
          # Dry runs load the image into the local daemon and boot it once —
          # the built image is verified without ever being pushed.
          load: ${{ inputs.dry_run }}
          # SLSA provenance (max detail) + SBOM attestation pushed alongside
          # the image so consumers can verify the build supply chain.
          provenance: ${{ inputs.dry_run && 'false' || 'mode=max' }}
          sbom: ${{ !inputs.dry_run }}
          # full is the default image (unsuffixed arch tag); lite uses -lite.
          # --target selects the runtime stage; FLAVOR selects the go-builder config.
          target: ${{ matrix.flavor == 'lite' && 'runtime-lite' || 'runtime-full' }}
          tags: ghcr.io/${{ github.repository }}:${{ needs.get-version.outputs.version }}${{ matrix.flavor == 'lite' && '-lite' || '' }}-${{ matrix.arch }}
          build-args: |
            FLAVOR=${{ matrix.flavor }}
            VERSION=${{ needs.get-version.outputs.version }}
            COMMIT=${{ github.sha }}
            BUILD_DATE=${{ github.event.repository.updated_at }}
          cache-from: type=gha,scope=${{ matrix.flavor }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.flavor }}-${{ matrix.arch }}

      - name: Verify the loaded image starts (dry run)
        if: inputs.dry_run
        env:
          IMAGE: ghcr.io/${{ github.repository }}:${{ needs.get-version.outputs.version }}${{ matrix.flavor == 'lite' && '-lite' || '' }}-${{ matrix.arch }}
        run: |
          echo "Booting $IMAGE --version against the locally loaded image"
          OUT=$(docker run --rm "$IMAGE" --version)
          echo "$OUT"
          echo "$OUT" | grep -q "${{ needs.get-version.outputs.version }}" || {
            echo "::error::Image reported an unexpected version: $OUT"
            exit 1
          }

      - name: Install cosign
        if: ${{ !inputs.dry_run }}
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign the pushed image (keyless)
        if: ${{ !inputs.dry_run }}
        # Signs by digest so the signature is bound to the exact image that was
        # just pushed; verify with `cosign verify ghcr.io/<repo>@<digest>`.
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          cosign sign --yes "ghcr.io/${{ github.repository }}@${DIGEST}"

  publish-docker-manifest:
    name: Create Docker Multi-arch Manifest (${{ matrix.flavor }})
    needs: [get-version, publish-docker-arch]
    if: always() && inputs.publish_docker && !inputs.dry_run && needs.publish-docker-arch.result == 'success'
    # id-token: write → cosign keyless signing of the merged index
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        flavor: [full, lite]
    runs-on: ubuntu-latest
    steps:
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute tags for this flavor
        id: tags
        env:
          VERSION: ${{ needs.get-version.outputs.version }}
          IS_PRERELEASE: ${{ needs.get-version.outputs.is_prerelease }}
          FLAVOR: ${{ matrix.flavor }}
        run: |
          # full is the default image (unsuffixed tags); lite appends -lite.
          if [ "$FLAVOR" = "lite" ]; then SUFFIX="-lite"; else SUFFIX=""; fi
          IMG="ghcr.io/${{ github.repository }}"

          # Parse major.minor from VERSION (e.g. 2026.8.6 -> 2026.8, 2026).
          MAJOR_MINOR=$(echo "$VERSION" | sed -E 's/^([0-9]+\.[0-9]+).*/\1/')
          MAJOR=$(echo "$MAJOR_MINOR" | cut -d. -f1)

          TAGS=""
          TAGS="$TAGS ${IMG}:${VERSION}${SUFFIX}"
          if [ "$IS_PRERELEASE" = "false" ]; then
            TAGS="$TAGS ${IMG}:${MAJOR_MINOR}${SUFFIX}"
            TAGS="$TAGS ${IMG}:${MAJOR}${SUFFIX}"
            TAGS="$TAGS ${IMG}:latest${SUFFIX}"
          else
            TAGS="$TAGS ${IMG}:rc${SUFFIX}"
          fi

          {
            echo "tags<<EOF"
            echo "$TAGS"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create and push multi-arch manifest
        env:
          FLAVOR_SUFFIX: ${{ matrix.flavor == 'lite' && '-lite' || '' }}
          VERSION: ${{ needs.get-version.outputs.version }}
        run: |
          for TAG in ${{ steps.tags.outputs.tags }}; do
            docker buildx imagetools create -t "$TAG" \
              "ghcr.io/${{ github.repository }}:${VERSION}${FLAVOR_SUFFIX}-amd64" \
              "ghcr.io/${{ github.repository }}:${VERSION}${FLAVOR_SUFFIX}-arm64"
          done

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign the multi-arch manifest (keyless)
        # The per-arch images are signed in publish-docker-arch; consumers
        # normally pull the merged index (e.g. :latest), so the index digest
        # must be signed too or signature verification fails on the manifest.
        env:
          FLAVOR_SUFFIX: ${{ matrix.flavor == 'lite' && '-lite' || '' }}
          VERSION: ${{ needs.get-version.outputs.version }}
        run: |
          INDEX="ghcr.io/${{ github.repository }}:${VERSION}${FLAVOR_SUFFIX}"
          DIGEST=$(docker buildx imagetools inspect "$INDEX" --format '{{.Manifest.Digest}}')
          echo "Signing index $INDEX@${DIGEST}"
          cosign sign --yes "ghcr.io/${{ github.repository }}@${DIGEST}"

  publish-docs-image:
    name: Build and Push Documentation Image
    needs: get-version
    runs-on: ubuntu-latest
    if: inputs.publish_docs
    # packages: write → GHCR push; id-token: write → cosign keyless signing
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24.20.0"

      - name: Install dependencies (workspace)
        run: bun install --frozen-lockfile

      - name: Build SDK
        working-directory: ./sdk
        run: bun run build

      - name: Build SDK React
        working-directory: ./sdk-react
        run: bun run build

      - name: Build docs site
        working-directory: ./docs
        run: bun run build

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Log in to GitHub Container Registry
        if: ${{ !inputs.dry_run }}
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for docs image
        id: meta-docs
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: |
            ghcr.io/${{ github.repository }}-docs
          tags: |
            type=semver,pattern={{version}},value=${{ needs.get-version.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.get-version.outputs.version }},enable=${{ needs.get-version.outputs.is_prerelease == 'false' }}
            type=semver,pattern={{major}},value=${{ needs.get-version.outputs.version }},enable=${{ needs.get-version.outputs.is_prerelease == 'false' }}
            type=raw,value=latest,enable=${{ needs.get-version.outputs.is_prerelease == 'false' }}
            type=raw,value=rc,enable=${{ needs.get-version.outputs.is_prerelease == 'true' }}

      - name: Build and push documentation image
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: Dockerfile.docs
          platforms: linux/amd64
          push: ${{ !inputs.dry_run }}
          load: ${{ inputs.dry_run }}
