  publish-kotlin-sdk:
    name: Publish Kotlin SDK to GitHub Packages
    needs: get-version
    runs-on: ubuntu-latest
    if: inputs.publish_kotlin_sdk
    permissions:
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6

      - name: Lint + test + build
        working-directory: sdk-kotlin
        run: ./gradlew detekt test build -Pversion="${{ needs.get-version.outputs.version }}"

      - name: Publish to GitHub Packages
        working-directory: sdk-kotlin
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.get-version.outputs.version }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          # Idempotent on re-run, and loud about half-published versions.
          # GitHub Packages registers a version on the first artifact PUT and
          # rejects all later ones with 409, so a publish that died mid-flight
          # (e.g. a cancelled run) leaves a version that can neither be
          # skipped (incomplete artifacts are unresolvable for consumers) nor
          # re-published. Both the POM and the JAR must exist to skip; if only
          # some exist, the version must be deleted before re-releasing.
          BASE_URL="https://maven.pkg.github.com/${{ github.repository }}/io/github/nimbleflux/fluxbase-kotlin/${VERSION}"
          POM_CODE=$(curl -sL -o /dev/null -w '%{http_code}' -u "$GITHUB_ACTOR:$GITHUB_TOKEN" "$BASE_URL/fluxbase-kotlin-${VERSION}.pom")  # -L: GitHub Packages 302-redirects valid artifacts
          JAR_CODE=$(curl -sL -o /dev/null -w '%{http_code}' -u "$GITHUB_ACTOR:$GITHUB_TOKEN" "$BASE_URL/fluxbase-kotlin-${VERSION}.jar")
          if [ "$POM_CODE" = "200" ] && [ "$JAR_CODE" = "200" ]; then
            echo "fluxbase-kotlin ${VERSION} already published — skipping (idempotent re-run)"
            exit 0
          fi
          if [ "$POM_CODE" != "404" ] || [ "$JAR_CODE" != "404" ]; then
            echo "::error::fluxbase-kotlin ${VERSION} is partially published in GitHub Packages (pom HTTP $POM_CODE, jar HTTP $JAR_CODE)."
            echo "::error::Delete the version, then re-run this job:"
            echo "::error::  gh api -X DELETE /orgs/${{ github.repository_owner }}/packages/maven/io.github.nimbleflux.fluxbase-kotlin/versions/<version-id>"
            exit 1
          fi
          if [ "$DRY_RUN" = "true" ]; then
            echo "[dry-run] detekt/test/build passed; would publish fluxbase-kotlin ${VERSION} to GitHub Packages"
            exit 0
          fi
          ./gradlew publishAllPublicationsToGprRepository -Pversion="${VERSION}"

  publish-go-module:
    name: Publish Go Module
    needs: get-version
    runs-on: ubuntu-latest
    if: inputs.publish_go_module && !inputs.dry_run
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod

      - name: Publish Go module
        run: |
          # Go modules are automatically available when tagged; this only
          # pokes pkg.go.dev so the new version is indexed promptly. A slow
          # or failing proxy must never fail the release.
          echo "Go module available at github.com/nimbleflux/fluxbase@${{ needs.get-version.outputs.tag_name }}"
          curl -sfS --max-time 30 \
            "https://proxy.golang.org/github.com/nimbleflux/fluxbase/@v/${{ needs.get-version.outputs.tag_name }}.info" \
            || echo "::warning::pkg.go.dev indexing ping failed (non-fatal); it will catch up on its own"

  publish-helm-chart:
    name: Publish Helm Chart to GHCR
    needs:
      [
        get-version,
        update-version-files,
        publish-postgres-manifests,
        update-postgres-version,
      ]
    runs-on: ubuntu-latest
    # packages: write → OCI chart push to GHCR; contents: write → gh-pages index commit
    permissions:
      contents: write
      packages: write
    # Publish Helm chart for all releases (stable and RC) unless disabled in workflow_dispatch
    if: |
      always() &&
      inputs.publish_helm &&
      (needs.update-version-files.result == 'success' || needs.update-version-files.result == 'skipped') &&
      (needs.publish-postgres-manifests.result == 'success' || needs.publish-postgres-manifests.result == 'skipped') &&
      (needs.update-postgres-version.result == 'success' || needs.update-postgres-version.result == 'skipped')
    env:
      VERSION: ${{ needs.get-version.outputs.version }}
      CHART_REF: ghcr.io/${{ github.repository_owner }}/charts/fluxbase
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.ref_name }}

      - name: Pull latest changes
        run: |
          git pull origin ${{ github.ref_name }} || true

      - name: Install Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5
        with:
          version: "latest"

      - name: Log in to GitHub Container Registry
        if: ${{ !inputs.dry_run }}
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Update Chart version
        run: |
          sed -i "s/^version:.*/version: ${VERSION}/" deploy/helm/fluxbase/Chart.yaml
          sed -i "s/^appVersion:.*/appVersion: \"${VERSION}\"/" deploy/helm/fluxbase/Chart.yaml

      - name: Add prerelease annotation for RC versions
        if: needs.get-version.outputs.is_prerelease == 'true'
        run: |
          cat >> deploy/helm/fluxbase/Chart.yaml << EOF
          annotations:
            artifacthub.io/prerelease: "true"
          EOF

      - name: Update Helm dependencies
        run: |
          helm dependency update deploy/helm/fluxbase

      - name: Package Helm chart
        run: |
          helm package deploy/helm/fluxbase

      - name: Push Helm chart to GHCR
        if: ${{ !inputs.dry_run }}
        run: |
          # Idempotent on re-run: skip if this chart version was already
          # pushed to the OCI registry by a partially failed attempt.
          if helm show chart "${CHART_REF}" --version "${VERSION}" > /dev/null 2>&1; then
            echo "Chart ${CHART_REF}:${VERSION} already published — skipping (idempotent re-run)"
            exit 0
          fi
          helm push fluxbase-${VERSION}.tgz oci://ghcr.io/${{ github.repository_owner }}/charts

      - name: Dry run — chart packaged
        if: inputs.dry_run
        run: |
          echo "[dry-run] chart fluxbase-${VERSION}.tgz packaged; would push to oci://ghcr.io/${{ github.repository_owner }}/charts and update the gh-pages index"

      - name: Generate Helm repository index
        run: |
          mkdir -p .helm-repo
          mv fluxbase-${{ needs.get-version.outputs.version }}.tgz .helm-repo/
          helm repo index .helm-repo --url https://${{ github.repository_owner }}.github.io/fluxbase

      - name: Commit and push index to gh-pages
        if: ${{ !inputs.dry_run }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Move Helm artifacts outside git working directory
          mv .helm-repo /tmp/helm-repo

          # Reset any changes to Chart.yaml before checkout
          git checkout -- deploy/helm/fluxbase/Chart.yaml

          # Try to fetch gh-pages branch, create orphan if it doesn't exist
          if git fetch origin gh-pages:gh-pages 2>/dev/null; then
            git checkout gh-pages
            # Merge new index with existing index to preserve history
            if [ -f index.yaml ]; then
              helm repo index /tmp/helm-repo --url https://${{ github.repository_owner }}.github.io/fluxbase --merge index.yaml
            fi
          else
            git checkout --orphan gh-pages
            git rm -rf . || true
          fi

          # Copy new chart package (keep existing .tgz files)
          cp /tmp/helm-repo/*.tgz .
          cp /tmp/helm-repo/index.yaml .

          # Commit and push
          git add index.yaml *.tgz
          git commit -m "Release Helm chart v${{ needs.get-version.outputs.version }}"
          git push origin gh-pages

  # ==========================================================================
  # Fluxbase Postgres Image
  # ==========================================================================

  get-postgres-versions:
    name: Get Postgres Versions
    runs-on: ubuntu-latest
    if: inputs.publish_postgres && !inputs.dry_run
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Generate build matrix from versions.json
        id: set-matrix
        run: |
          MATRIX=$(cat postgres/versions.json | jq -c '{include: [.versions[] | {major: .major, version: .version, imageVersion: .imageVersion, latest: (.latest // false)}]}')
          echo "matrix=$MATRIX" >> $GITHUB_OUTPUT
          echo "Generated matrix: $MATRIX"

  publish-postgres-amd64:
    name: Build Postgres Image (AMD64)
    needs: [get-version, get-postgres-versions]
    if: inputs.publish_postgres && !inputs.dry_run
    runs-on: ubuntu-latest
    # packages: write → GHCR push; id-token: write → cosign keyless signing
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      matrix: ${{ fromJson(needs.get-postgres-versions.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push AMD64 image
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: ./postgres
          file: ./postgres/Dockerfile
          platforms: linux/amd64
          push: true
          provenance: mode=max
          sbom: true
          tags: ghcr.io/${{ github.repository_owner }}/fluxbase-postgres:${{ matrix.version }}-amd64
          build-args: |
            POSTGRES_VERSION=${{ matrix.version }}
            POSTGRES_MAJOR=${{ matrix.major }}
          cache-from: type=gha,scope=postgres-${{ matrix.major }}-amd64
          cache-to: type=gha,mode=max,scope=postgres-${{ matrix.major }}-amd64

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign the pushed image (keyless)
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          cosign sign --yes "ghcr.io/${{ github.repository_owner }}/fluxbase-postgres@${DIGEST}"

  publish-postgres-arm64:
    name: Build Postgres Image (ARM64)
    needs: [get-version, get-postgres-versions]
    if: inputs.publish_postgres && !inputs.dry_run
    runs-on: ubuntu-24.04-arm
    # packages: write → GHCR push; id-token: write → cosign keyless signing
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      matrix: ${{ fromJson(needs.get-postgres-versions.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ARM64 image
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: ./postgres
          file: ./postgres/Dockerfile
          platforms: linux/arm64
          push: true
          provenance: mode=max
          sbom: true
          tags: ghcr.io/${{ github.repository_owner }}/fluxbase-postgres:${{ matrix.version }}-arm64
          build-args: |
            POSTGRES_VERSION=${{ matrix.version }}
            POSTGRES_MAJOR=${{ matrix.major }}
          cache-from: type=gha,scope=postgres-${{ matrix.major }}-arm64
          cache-to: type=gha,mode=max,scope=postgres-${{ matrix.major }}-arm64

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign the pushed image (keyless)
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          cosign sign --yes "ghcr.io/${{ github.repository_owner }}/fluxbase-postgres@${DIGEST}"

  publish-postgres-manifests:
    name: Create Postgres Multi-arch Manifests
    needs:
      [
        get-version,
        get-postgres-versions,
        publish-postgres-amd64,
        publish-postgres-arm64,
      ]
    if: inputs.publish_postgres && !inputs.dry_run
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix: ${{ fromJson(needs.get-postgres-versions.outputs.matrix) }}
    steps:
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and push multi-arch manifest
        run: |
          IMAGE="ghcr.io/${{ github.repository_owner }}/fluxbase-postgres"
          VERSION="${{ matrix.version }}"
          MAJOR="${{ matrix.major }}"
          IMAGE_VERSION="${{ matrix.imageVersion }}"
          IS_LATEST="${{ matrix.latest }}"

          # Create manifest with version tag (rolling)
          docker buildx imagetools create \
            -t ${IMAGE}:${VERSION} \
            ${IMAGE}:${VERSION}-amd64 \
            ${IMAGE}:${VERSION}-arm64

          # Create manifest with immutable tag (postgres version + image version)
          docker buildx imagetools create \
            -t ${IMAGE}:${VERSION}-v${IMAGE_VERSION} \
            ${IMAGE}:${VERSION}-amd64 \
            ${IMAGE}:${VERSION}-arm64

          # Create manifest with major version tag (rolling)
          docker buildx imagetools create \
            -t ${IMAGE}:${MAJOR} \
            ${IMAGE}:${VERSION}-amd64 \
            ${IMAGE}:${VERSION}-arm64

          # Create :latest tag if this version is marked as latest
          if [ "$IS_LATEST" = "true" ]; then
            docker buildx imagetools create \
              -t ${IMAGE}:latest \
              ${IMAGE}:${VERSION}-amd64 \
              ${IMAGE}:${VERSION}-arm64
          fi

          echo "Created manifests for PostgreSQL ${VERSION} (immutable: ${VERSION}-v${IMAGE_VERSION})"

  update-postgres-version:
    name: Update Postgres version in Helm values
    needs: [get-postgres-versions, publish-postgres-manifests]
    runs-on: ubuntu-latest
    if: inputs.publish_postgres && !inputs.dry_run
    # Commits and pushes the values.yaml bump
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.ref_name }}

      - name: Pull latest changes
        run: |
          git pull origin ${{ github.ref_name }} || true

      - name: Update Helm values.yaml with new postgres image tag
        run: |
          # Get the postgres version info from versions.json
          # For simplicity, use the first (and typically only) version marked as latest
          POSTGRES_VERSION=$(cat postgres/versions.json | jq -r '.versions[] | select(.latest == true) | .version')
          IMAGE_VERSION=$(cat postgres/versions.json | jq -r '.versions[] | select(.latest == true) | .imageVersion')

          # Create the immutable tag
          NEW_TAG="${POSTGRES_VERSION}-v${IMAGE_VERSION}"

          echo "Updating postgres image tag to: ${NEW_TAG}"

          # Update the tag in values.yaml
          sed -i '/fluxbase-postgres/,/pullPolicy/{s/tag: "[^"]*"/tag: "'"${NEW_TAG}"'"/}' deploy/helm/fluxbase/values.yaml

      - name: Commit postgres version update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add deploy/helm/fluxbase/values.yaml

          if git diff --staged --quiet; then
            echo "No postgres version changes to commit"
          else
            POSTGRES_VERSION=$(cat postgres/versions.json | jq -r '.versions[] | select(.latest == true) | .version')
            IMAGE_VERSION=$(cat postgres/versions.json | jq -r '.versions[] | select(.latest == true) | .imageVersion')
            git commit -m "chore: Update fluxbase-postgres image to ${POSTGRES_VERSION}-v${IMAGE_VERSION}"
            git push origin HEAD:${{ github.ref_name }}
          fi

  # ==========================================================================
  # POST-RELEASE SMOKE TESTS
  # ==========================================================================
  smoke-test:
    name: Post-release Smoke Tests
    needs:
      [
        get-version,
        publish-docker-manifest,
        publish-npm-sdk,
        publish-npm-sdk-react,
        publish-npm-sdk-svelte,
        publish-npm-sdk-next,
        publish-npm-sdk-vue,
      ]
    runs-on: ubuntu-latest
    # Edits the release body with smoke-test results (contents: write) and
    # opens a release-blocker issue when the smoke tests fail (issues: write)
    # — pre-release-checks refuses to release while such an issue is open,
    # so a broken publish always gates the NEXT release.
    permissions:
      contents: write
      issues: write
    # Skipped on dry runs: the publish-docker-arch dry-run jobs already boot
    # the locally built images, and nothing was published to smoke-test.
    if: |
      always() && !inputs.dry_run &&
      (needs.publish-docker-manifest.result == 'success' || needs.publish-docker-manifest.result == 'skipped') &&
      (needs.publish-npm-sdk.result == 'success' || needs.publish-npm-sdk.result == 'skipped')
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24.20.0"

      - name: Test Docker image availability
        if: needs.publish-docker-manifest.result == 'success'
        run: |
          VERSION="${{ needs.get-version.outputs.version }}"
          IMAGE="ghcr.io/${{ github.repository }}:${VERSION}"
          LITE_IMAGE="ghcr.io/${{ github.repository }}:${VERSION}-lite"

          for IMG in "$IMAGE" "$LITE_IMAGE"; do
            echo "Testing Docker image: $IMG"
            docker pull "$IMG"

            OUT=$(docker run --rm "$IMG" --version)
            echo "$OUT"
            if ! echo "$OUT" | grep -q "$VERSION"; then
              echo "::error::$IMG did not report version $VERSION — got: $OUT"
              exit 1
            fi
          done

          echo "✅ Docker image smoke tests passed (full + lite)"

      - name: Test NPM SDK installation
        if: needs.publish-npm-sdk.result == 'success'
        run: |
          VERSION="${{ needs.get-version.outputs.version }}"
          PACKAGE="@nimbleflux/fluxbase-sdk"

          mkdir -p /tmp/sdk-test && cd /tmp/sdk-test
          npm init -y > /dev/null

          # Registry propagation delay after publish; retry a few times.
          INSTALLED=0
          for i in 1 2 3; do
            sleep 10
            if npm install "${PACKAGE}@${VERSION}" > /tmp/sdk-install.log 2>&1; then
              INSTALLED=1
              break
            fi
            echo "Attempt $i failed, retrying in 30s..."
            cat /tmp/sdk-install.log
            sleep 30
          done

          if [ "$INSTALLED" != "1" ]; then
            echo "::error::${PACKAGE}@${VERSION} could not be installed after 3 attempts"
            exit 1
          fi

          echo "✅ NPM SDK smoke test passed"
          npm list "${PACKAGE}"

      - name: Test NPM React SDK installation
        if: needs.publish-npm-sdk-react.result == 'success'
        run: |
          VERSION="${{ needs.get-version.outputs.version }}"
          PACKAGE="@nimbleflux/fluxbase-sdk-react"

          mkdir -p /tmp/sdk-react-test && cd /tmp/sdk-react-test
          npm init -y > /dev/null
          # Install React as peer dependency first
          npm install react@19 > /dev/null 2>&1

          INSTALLED=0
          for i in 1 2 3; do
            sleep 10
            if npm install "${PACKAGE}@${VERSION}" > /tmp/sdk-install.log 2>&1; then
              INSTALLED=1
              break
            fi
            echo "Attempt $i failed, retrying in 30s..."
            cat /tmp/sdk-install.log
            sleep 30
          done

          if [ "$INSTALLED" != "1" ]; then
            echo "::error::${PACKAGE}@${VERSION} could not be installed after 3 attempts"
            exit 1
          fi

          echo "✅ NPM React SDK smoke test passed"
          npm list "${PACKAGE}"

      - name: Test NPM Svelte SDK installation
        if: needs.publish-npm-sdk-svelte.result == 'success'
        run: |
          VERSION="${{ needs.get-version.outputs.version }}"
          PACKAGE="@nimbleflux/fluxbase-sdk-svelte"

          mkdir -p /tmp/sdk-svelte-test && cd /tmp/sdk-svelte-test
          npm init -y > /dev/null

          INSTALLED=0
          for i in 1 2 3; do
            sleep 10
            if npm install "${PACKAGE}@${VERSION}" > /tmp/sdk-install.log 2>&1; then
              INSTALLED=1
              break
            fi
            echo "Attempt $i failed, retrying in 30s..."
            cat /tmp/sdk-install.log
            sleep 30
          done

          if [ "$INSTALLED" != "1" ]; then
            echo "::error::${PACKAGE}@${VERSION} could not be installed after 3 attempts"
            exit 1
          fi

          echo "✅ NPM Svelte SDK smoke test passed"
          npm list "${PACKAGE}"

      - name: Test NPM Next.js SDK installation
        if: needs.publish-npm-sdk-next.result == 'success'
        run: |
          VERSION="${{ needs.get-version.outputs.version }}"
          PACKAGE="@nimbleflux/fluxbase-sdk-next"

          mkdir -p /tmp/sdk-next-test && cd /tmp/sdk-next-test
          npm init -y > /dev/null

          INSTALLED=0
          for i in 1 2 3; do
            sleep 10
            if npm install "${PACKAGE}@${VERSION}" > /tmp/sdk-install.log 2>&1; then
              INSTALLED=1
              break
            fi
            echo "Attempt $i failed, retrying in 30s..."
            cat /tmp/sdk-install.log
            sleep 30
          done

          if [ "$INSTALLED" != "1" ]; then
            echo "::error::${PACKAGE}@${VERSION} could not be installed after 3 attempts"
            exit 1
          fi

          echo "✅ NPM Next.js SDK smoke test passed"
          npm list "${PACKAGE}"

      - name: Test NPM Vue SDK installation
        if: needs.publish-npm-sdk-vue.result == 'success'
        run: |
          VERSION="${{ needs.get-version.outputs.version }}"
          PACKAGE="@nimbleflux/fluxbase-sdk-vue"

          mkdir -p /tmp/sdk-vue-test && cd /tmp/sdk-vue-test
          npm init -y > /dev/null

          INSTALLED=0
          for i in 1 2 3; do
            sleep 10
            if npm install "${PACKAGE}@${VERSION}" > /tmp/sdk-install.log 2>&1; then
              INSTALLED=1
              break
            fi
            echo "Attempt $i failed, retrying in 30s..."
            cat /tmp/sdk-install.log
            sleep 30
          done

          if [ "$INSTALLED" != "1" ]; then
            echo "::error::${PACKAGE}@${VERSION} could not be installed after 3 attempts"
            exit 1
          fi

          echo "✅ NPM Vue SDK smoke test passed"
          npm list "${PACKAGE}"

      - name: Open release-blocker issue on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.get-version.outputs.tag_name }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          TITLE="Release smoke test failed for ${TAG}"
          BODY="The post-release smoke tests failed for \`${TAG}\`.

          While this issue is open, \`pre-release-checks\` refuses to cut the next release.

          Run: ${RUN_URL}

          Fix, re-run the failed jobs to complete the release, then close this issue."

          # One open blocker per release tag: comment on the existing issue
          # instead of piling up duplicates across re-runs.
          EXISTING=$(gh issue list --label release-blocker --state open \
            --json number,title --jq ".[] | select(.title == \"${TITLE}\") | .number" | head -n1)
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body "Smoke test failed again: ${RUN_URL}"
          else
            gh issue create --label release-blocker --title "$TITLE" --body "$BODY"
          fi

      - name: Report smoke test results
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ needs.get-version.outputs.version }}"
          TAG="${{ needs.get-version.outputs.tag_name }}"

          # Add a comment to the release with smoke test results
          COMMENT="## Smoke Test Results

          | Component | Status |
          |-----------|--------|
          | Docker Image | ${{ needs.publish-docker-manifest.result == 'success' && '✅ Verified' || '⏭️ Skipped' }} |
          | NPM SDK | ${{ needs.publish-npm-sdk.result == 'success' && '✅ Verified' || '⏭️ Skipped' }} |
          | NPM React SDK | ${{ needs.publish-npm-sdk-react.result == 'success' && '✅ Verified' || '⏭️ Skipped' }} |
          | NPM Svelte SDK | ${{ needs.publish-npm-sdk-svelte.result == 'success' && '✅ Verified' || '⏭️ Skipped' }} |
          | NPM Next.js SDK | ${{ needs.publish-npm-sdk-next.result == 'success' && '✅ Verified' || '⏭️ Skipped' }} |
          | NPM Vue SDK | ${{ needs.publish-npm-sdk-vue.result == 'success' && '✅ Verified' || '⏭️ Skipped' }} |

          *Smoke tests completed at $(date -u '+%Y-%m-%d %H:%M:%S UTC')*"

          # Update the release with smoke test info
          CURRENT_BODY=$(gh release view "$TAG" --json body --jq '.body')
          NEW_BODY="${CURRENT_BODY}

          ---

          ${COMMENT}"

          gh release edit "$TAG" --notes "$NEW_BODY" || echo "Could not update release notes"

          echo "Smoke test results:"
          echo "$COMMENT"
